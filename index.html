<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tharindu Buddhika | Academic Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  /* === THEME VARIABLES (PURPLE LUXE EDITION) === */
  :root[data-theme="dark"] {
    --purple: #a855f7;
    --purple-light: #c084fc;
    --purple-glow: rgba(168, 85, 247, 0.4);
    --bg-main: #090514;
    --bg-gradient: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(168, 85, 247, 0.12) 0%, transparent 60%), radial-gradient(ellipse 60% 80% at 85% 80%, rgba(192, 132, 252, 0.08) 0%, transparent 55%);
    --card: #120d24;
    --card-hover: #1a1433;
    --border: rgba(168, 85, 247, 0.2);
    --text: #e2daf0;
    --text-white: #ffffff;
    --muted: #948fad;
    --shadow: rgba(0, 0, 0, 0.6);
  }

  :root[data-theme="light"] {
    --purple: #7e22ce;
    --purple-light: #9333ea;
    --purple-glow: rgba(126, 34, 206, 0.2);
    --bg-main: #f8f6fc;
    --bg-gradient: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(126, 34, 206, 0.06) 0%, transparent 60%), radial-gradient(ellipse 60% 80% at 85% 80%, rgba(147, 51, 234, 0.04) 0%, transparent 55%);
    --card: #ffffff;
    --card-hover: #f3effa;
    --border: rgba(126, 34, 206, 0.25);
    --text: #2d263b;
    --text-white: #120d1e;
    --muted: #726980;
    --shadow: rgba(126, 34, 206, 0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-main);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s ease;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--bg-gradient);
    pointer-events: none;
    z-index: 0;
  }

  /* === HEADER & CONTROLS === */
  header {
    position: relative;
    z-index: 10;
    padding: 60px 40px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    background: linear-gradient(180deg, rgba(168, 85, 247, 0.04) 0%, transparent 100%);
  }

  .badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--purple-light);
    border: 1px solid var(--border);
    padding: 5px 14px;
    border-radius: 4px;
    margin-bottom: 18px;
    background: rgba(168, 85, 247, 0.08);
    backdrop-filter: blur(4px);
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.05);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 900;
    line-height: 1.05;
    color: var(--text-white);
    letter-spacing: -0.5px;
  }

  h1 span { 
    color: var(--purple); 
    display: block;
    text-shadow: 0 0 20px var(--purple-glow);
  }
  
  .subtitle { margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: 0.5px; }

  /* === THEME TOGGLE BUTTON === */
  .theme-switch-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
  }

  .theme-toggle-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--purple-light);
    padding: 8px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 12px var(--shadow);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .theme-toggle-btn:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: var(--purple-light);
    box-shadow: 0 6px 20px var(--purple-glow);
    background: var(--card-hover);
  }
  
  .theme-toggle-btn:active {
    transform: translateY(-1px) scale(0.98);
  }

  /* === STUDENT CARD === */
  .student-card {
    background: rgba(18, 13, 36, 0.6);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 32px;
    text-align: right;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px var(--shadow);
    transition: all 0.4s ease;
  }
  
  .student-card:hover {
    border-color: rgba(168, 85, 247, 0.4);
    box-shadow: 0 15px 35px rgba(168, 85, 247, 0.1);
    transform: translateY(-2px);
  }

  .student-card .label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .student-card .value { font-family: 'DM Mono', monospace; font-size: 14px; color: var(--purple-light); font-weight: 500; }
  .student-card .name-val { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--text-white); font-weight: 700; margin-bottom: 6px; }

  /* === STATS BAR === */
  .stats-bar { 
    position: relative; 
    z-index: 10; 
    display: flex; 
    border-bottom: 1px solid var(--border); 
    background: rgba(9, 5, 20, 0.5);
    backdrop-filter: blur(8px);
    transition: background 0.4s ease; 
  }
  
  .stat-item { 
    flex: 1; 
    padding: 24px 28px; 
    border-right: 1px solid var(--border); 
    text-align: center; 
    transition: all 0.3s ease;
  }
  
  .stat-item:hover {
    background: rgba(168, 85, 247, 0.04);
  }
  
  .stat-item:last-child { border-right: none; }
  .stat-num { font-family: 'Playfair Display', serif; font-size: 2.4rem; font-weight: 900; color: var(--purple-light); line-height: 1; transition: transform 0.3s ease; }
  .stat-item:hover .stat-num { transform: scale(1.08); color: var(--purple); }
  .stat-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 6px; font-family: 'DM Mono', monospace; }

  /* === FILTER BAR === */
  .filter-bar { position: relative; z-index: 10; padding: 24px 40px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); }
  .filter-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: 'DM Mono', monospace; margin-right: 6px; }
  
  .filter-btn { 
    font-family: 'DM Mono', monospace; 
    font-size: 11px; 
    letter-spacing: 1px; 
    padding: 8px 18px; 
    border-radius: 6px; 
    border: 1px solid var(--border); 
    background: transparent; 
    color: var(--muted); 
    cursor: pointer; 
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
    text-transform: uppercase; 
  }
  
  .filter-btn:hover { 
    border-color: var(--purple-light); 
    color: var(--purple-light); 
    background: rgba(168, 85, 247, 0.08);
    transform: translateY(-2px);
  }
  
  .filter-btn.active {
    border-color: var(--purple);
    color: var(--text-white);
    background: var(--purple);
    box-shadow: 0 4px 15px var(--purple-glow);
    transform: translateY(-2px);
  }
  
  .filter-btn:active {
    transform: translateY(0);
  }

  /* === MAIN GRID === */
  main { position: relative; z-index: 10; padding: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
  .sem-header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin-top: 24px; margin-bottom: 8px; animation: fadeIn 0.6s ease-in-out both; }
  .sem-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; transition: transform 0.3s ease; }
  .sem-header:hover .sem-dot { transform: scale(1.3); }
  .sem-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--text-white); }
  .sem-title small { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-left: 10px; background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; }
  .sem-line { flex: 1; height: 1px; background: var(--border); }

  /* === SUBJECT CARD === */
  .subject-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.16. 1, 0.3, 1), box-shadow 0.4s, border-color 0.3s, background 0.4s ease;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-decoration: none;
    box-shadow: 0 4px 16px var(--shadow);
    animation: scaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .subject-card:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow: 0 20px 40px var(--shadow), 0 0 25px rgba(168, 85, 247, 0.15);
    background: var(--card-hover);
  }
  
  .subject-card:active {
    transform: translateY(-2px) scale(0.99);
  }

  .card-code { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); transition: color 0.3s ease; }
  .subject-card:hover .card-code { color: var(--purple-light); }
  .card-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--text-white); line-height: 1.35; flex: 1; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .card-tag { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-family: 'DM Mono', monospace; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); background: rgba(0,0,0,0.1); transition: all 0.3s ease; }
  
  .subject-card:hover .card-tag {
    color: var(--text-white);
    background: rgba(168, 85, 247, 0.1);
  }
  
  .card-arrow { font-size: 18px; color: var(--purple-light); opacity: 0; transform: translateX(-10px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  .subject-card:hover .card-arrow { opacity: 1; transform: translateX(0); text-shadow: 0 0 8px var(--purple); }

  .elective-badge {
    position: absolute;
    top: 14px; right: 14px;
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #f43f5e;
    background: rgba(244, 63, 94, 0.1);
    border: 1px solid rgba(244, 63, 94, 0.2);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
    box-shadow: 0 0 10px rgba(244, 63, 94, 0.1);
  }

  /* === FOOTER === */
  footer { position: relative; z-index: 10; padding: 30px 40px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; background: rgba(9, 5, 20, 0.8); backdrop-filter: blur(8px); transition: background 0.4s ease; }
  .footer-brand { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--purple-light); letter-spacing: 0.5px; }
  .footer-note { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }

  /* === ANIMATIONS === */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  @keyframes scaleUp {
    from { opacity: 0; transform: scale(0.96) translateY(15px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  @media (max-width: 600px) {
    header { padding: 36px 20px 28px; }
    main { padding: 20px; gap: 16px; grid-template-columns: 1fr; }
    .filter-bar { padding: 16px 20px; gap: 8px; }
    .stats-bar { flex-wrap: wrap; }
    .stat-item { min-width: 50%; padding: 16px; border-bottom: 1px solid var(--border); }
    .stat-item:nth-child(2n) { border-right: none; }
    .stat-item:nth-child(3), .stat-item:nth-child(4) { border-bottom: none; }
    footer { padding: 20px; flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="theme-switch-wrapper">
      <div class="badge">Personal Academic Portal</div>
      <!-- THEME TOGGLE BUTTON -->
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
      </button>
    </div>
    <h1>Tharindu <span>Buddhika</span></h1>
    <p class="subtitle">Bachelor of Business Administration &nbsp;·&nbsp; Module Index</p>
  </div>
  <div class="student-card">
    <div class="label">Full Name</div>
    <div class="name-val">Tharindu Buddhika</div>
    <div class="label" style="margin-top:10px;">Student ID</div>
    <div class="value">COM/BMgt-558/IFLS26-15/0001</div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-num">33</div><div class="stat-label">Total Modules</div></div>
  <div class="stat-item"><div class="stat-num">4</div><div class="stat-label">Years</div></div>
  <div class="stat-item"><div class="stat-num">8</div><div class="stat-label">Semesters</div></div>
  <div class="stat-item"><div class="stat-num">3</div><div class="stat-label">Electives</div></div>
</div>

<div class="filter-bar">
  <span class="filter-label">Filter:</span>
  <button class="filter-btn active" onclick="filterSem('all', this)">All</button>
  <button class="filter-btn" onclick="filterSem('year1', this)">Year 1</button>
  <button class="filter-btn" onclick="filterSem('year2', this)">Year 2</button>
  <button class="filter-btn" onclick="filterSem('year3', this)">Year 3</button>
  <button class="filter-btn" onclick="filterSem('year4', this)">Year 4</button>
  <button class="filter-btn" onclick="filterSem('elective', this)">Electives</button>
</div>

<main id="main-grid"></main>

<footer>
  <div class="footer-brand">TB Academic Index</div>
  <div class="footer-note">Personal Use Only &nbsp;·&nbsp; COM/BMgt-558/IFLS26-15/0001</div>
</footer>

<script>
// Data Set (Varying purple hue tones for different semesters)
const SEMESTERS = [
  {
    id: 'sem1', year: 'year1', label: 'Year 1 — Semester 1', color: '#a855f7',
    subjects: [
      { code: 'MGBM1401', title: 'Management Fundamentals' },
      { code: 'MGBM1302', title: 'Business Mathematics for Decisions' },
      { code: 'MGBM1403', title: 'Introduction to Information & Communication Technology' },
      { code: 'MGBM1404', title: 'Soft Skills in Business Communication' },
      { code: 'MGBM1005', title: 'English Language for Business 1' },
    ]
  },
  {
    id: 'sem2', year: 'year1', label: 'Year 1 — Semester 2', color: '#bc6ff1',
    subjects: [
      { code: 'MGBM1306', title: 'Microeconomics' },
      { code: 'MGBM1407', title: 'Marketing Management' },
      { code: 'MGBM1408', title: 'Financial Accounting' },
      { code: 'MGBM1409', title: 'Organizational Behaviour' },
      { code: 'MGBM1010', title: 'English Language for Business 2' },
    ]
  },
  {
    id: 'sem3', year: 'year2', label: 'Year 2 — Semester 3', color: '#8b5cf6',
    subjects: [
      { code: 'MGBM2411', title: 'Business Law' },
      { code: 'MGBM2412', title: 'Business Statistics' },
      { code: 'MGBM2413', title: 'Management Accounting' },
      { code: 'MGBM2314', title: 'Business Information Systems' },
    ]
  },
  {
    id: 'sem4', year: 'year2', label: 'Year 2 — Semester 4', color: '#7c3aed',
    subjects: [
      { code: 'MGBM2415', title: 'Managerial Economics' },
      { code: 'MGBM2416', title: 'Human Resource Management' },
      { code: 'MGBM2417', title: 'Finance Management' },
      { code: 'MGBM2318', title: 'Managerial Soft Skills' },
    ]
  },
  {
    id: 'sem5', year: 'year3', label: 'Year 3 — Semester 5', color: '#d946ef',
    subjects: [
      { code: 'MGBM3419', title: 'Development Economics' },
      { code: 'MGBM3420', title: 'Strategic Marketing Management' },
      { code: 'MGBM3421', title: 'Supply Chain Management' },
      { code: 'MGBM3422', title: 'International Business Strategy' },
    ]
  },
  {
    id: 'sem6', year: 'year3', label: 'Year 3 — Semester 6', color: '#c084fc',
    subjects: [
      { code: 'MGBM3423', title: 'Strategic Brand Management' },
      { code: 'MGBM3424', title: 'Research Methodology' },
      { code: 'MGBM3325', title: 'Operations Management' },
      { code: 'MGBM3326', title: 'Corporate Social Responsibility & Ethics', elective: true },
      { code: 'MGBM3327', title: 'Entrepreneurship', elective: true },
      { code: 'MGBM3328', title: 'E-Commerce', elective: true },
    ]
  },
  {
    id: 'sem7', year: 'year4', label: 'Year 4 — Semester 7', color: '#6366f1',
    subjects: [
      { code: 'MGBM4429', title: 'Strategic Management' },
      { code: 'MGBM4430', title: 'Strategic Finance' },
      { code: 'MGBM4631', title: 'Project Management' },
    ]
  },
  {
    id: 'sem8', year: 'year4', label: 'Year 4 — Semester 8', color: '#4f46e5',
    subjects: [
      { code: 'MGBM4432', title: 'Academic Writing' },
      { code: 'MGBM4633', title: 'Dissertation' },
      { code: 'MGBM4634', title: 'Internship in Business Administration' },
    ]
  }
];

// Theme Switch Logic
function toggleTheme() {
  const root = document.documentElement;
  const currentTheme = root.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  
  root.setAttribute('data-theme', newTheme);
  updateThemeUI(newTheme);
}

function updateThemeUI(theme) {
  const icon = document.getElementById('themeIcon');
  const text = document.getElementById('themeText');
  
  if (theme === 'dark') {
    icon.textContent = '🌙';
    text.textContent = 'Dark Mode';
  } else {
    icon.textContent = '☀️';
    text.textContent = 'Light Mode';
  }
}

// Build Grid Function
function buildGrid(filter = 'all') {
  const grid = document.getElementById('main-grid');
  grid.innerHTML = '';

  SEMESTERS.forEach((sem, si) => {
    const subjects = filter === 'elective'
      ? sem.subjects.filter(s => s.elective)
      : sem.subjects;

    const yearMatch = filter === 'all' || filter === sem.year || filter === 'elective';
    if (!yearMatch || subjects.length === 0) return;

    // Semester header
    const hdr = document.createElement('div');
    hdr.className = 'sem-header';
    hdr.innerHTML = `
      <div class="sem-dot" style="background:${sem.color};box-shadow:0 0 12px ${sem.color}aa;"></div>
      <div class="sem-title">${sem.label} <small>${sem.id.toUpperCase()}</small></div>
      <div class="sem-line"></div>
    `;
    grid.appendChild(hdr);

    // Subject cards
    subjects.forEach((sub, i) => {
      const card = document.createElement('a');
      card.className = 'subject-card';
      card.href = `subjects/${sub.code.toLowerCase()}.html`;
      card.style.borderTop = `3px solid ${sem.color}`;
      // Staggered delay animation for dynamic look
      card.style.animationDelay = `${i * 0.05}s`;
      
      card.innerHTML = `
        ${sub.elective ? '<span class="elective-badge">Elective</span>' : ''}
        <div class="card-code">${sub.code}</div>
        <div class="card-title">${sub.title}</div>
        <div class="card-footer">
          <span class="card-tag" style="border-color:${sem.color}44;color:${sem.color};">${sem.id.replace('sem','Sem ')}</span>
          <span class="card-arrow">→</span>
        </div>
      `;
      grid.appendChild(card);
    });
  });
}

function filterSem(f, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildGrid(f);
}

// Initialize
buildGrid('all');
</script>
</body>
</html>
