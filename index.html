<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tharindu Buddhika | Premium Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;--card2:#faf8ff;
  --text:#1e1b4b;--text2:#4c1d95;--muted:#6d6a8a;
  --accent:#7c3aed;--accent2:#9333ea;--accent3:#a855f7;
  --border:rgba(124,58,237,0.15);--border2:rgba(124,58,237,0.3);
  --shadow:0 4px 24px rgba(124,58,237,0.12);
  --shadow2:0 8px 40px rgba(124,58,237,0.2);
  --gold:#f59e0b;--green:#10b981;--red:#ef4444;
  --glass:rgba(255,255,255,0.7);--glass-border:rgba(124,58,237,0.2);
}
[data-theme="dark"]{
  --bg:#0d0b1e;--bg2:#110f2a;--card:#1a1730;--card2:#1f1c38;
  --text:#e9e4ff;--text2:#c4b5fd;--muted:#8b8aaa;
  --accent:#a78bfa;--accent2:#c084fc;--accent3:#d8b4fe;
  --border:rgba(167,139,250,0.15);--border2:rgba(167,139,250,0.3);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow2:0 8px 40px rgba(124,58,237,0.25);
  --glass:rgba(26,23,48,0.8);--glass-border:rgba(167,139,250,0.2);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}

#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
.loader-ring{width:60px;height:60px;border:4px solid var(--border2);border-top:4px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));width:0%;z-index:1100;border-radius:0 2px 2px 0}

.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;border-radius:50%;opacity:.12;animation:floatBubble linear infinite}
@keyframes floatBubble{0%{transform:translateY(110vh) scale(0)}50%{opacity:.15}100%{transform:translateY(-10vh) scale(1);opacity:0}}

header{position:sticky;top:0;z-index:1000;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.header-logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.1rem;color:var(--accent)}
.theme-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--accent);cursor:pointer}

main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:48px 20px}

.hero{border-radius:24px;padding:60px 40px;background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(168,85,247,.08));border:1px solid var(--border2);text-align:center;margin-bottom:56px}
.hero h1{font-family:'Poppins',sans-serif;font-size:clamp(2rem,5vw,3rem);font-weight:800;color:var(--text);margin-bottom:12px}

.gpa-section{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:var(--shadow)}
.gpa-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;margin-bottom:12px;align-items:center}
.gpa-input,.gpa-select{padding:11px 14px;border:1px solid var(--border2);border-radius:12px;background:var(--bg);color:var(--text)}
.btn-add{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px dashed var(--border2);background:transparent;color:var(--accent);cursor:pointer}
.btn-remove{width:36px;height:36px;border-radius:10px;background:rgba(239,68,68,.1);border:none;color:var(--red);cursor:pointer}
.gpa-val{font-family:'JetBrains Mono',monospace;font-size:2.2rem;font-weight:700;color:var(--accent)}

#back-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--accent);cursor:pointer;opacity:0;transition:all .3s;z-index:997}
#back-top.show{opacity:1}
</style>
</head>
<body>

<div id="loader"><div class="loader-ring"></div></div>
<div id="progress-bar"></div>
<div class="bubbles" id="bubbles"></div>

<header>
  <div class="header-logo">MY INDEX</div>
  <button class="theme-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
</header>

<main>
  <div class="hero">
    <h1>Premium Workspace</h1>
    <p>GPA Calculator & Tools</p>
  </div>

  <section class="gpa-section">
    <div id="gpa-container">
      <div class="gpa-row">
        <input type="text" placeholder="Subject" class="gpa-input">
        <input type="number" placeholder="Credits" class="gpa-input credit-val" value="3">
        <select class="gpa-select grade-val">
          <option value="4.00">A</option><option value="3.70">A-</option>
          <option value="3.30">B+</option><option value="3.00">B</option>
          <option value="2.00">C</option><option value="0.00">F</option>
        </select>
        <button class="btn-remove" onclick="removeRow(this)">×</button>
      </div>
    </div>
    <button class="btn-add" onclick="addRow()"><i class="fas fa-plus"></i> Add Subject</button>
    <div style="margin-top:20px;text-align:right">
      <div style="font-size:0.9rem">Current GPA</div>
      <div class="gpa-val" id="gpa-display">0.00</div>
    </div>
  </section>
</main>

<button id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-arrow-up"></i></button>

<script>
// Theme
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  themeBtn.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
});

// GPA Logic
function calcGPA() {
  let tc = 0, tp = 0;
  document.querySelectorAll('.gpa-row').forEach(r => {
    const c = parseFloat(r.querySelector('.credit-val').value) || 0;
    const g = parseFloat(r.querySelector('.grade-val').value) || 0;
    tc += c; tp += c * g;
  });
  document.getElementById('gpa-display').textContent = tc > 0 ? (tp / tc).toFixed(2) : '0.00';
}

function addRow() {
  const r = document.createElement('div');
  r.className = 'gpa-row';
  r.innerHTML = `<input type="text" placeholder="Subject" class="gpa-input">
    <input type="number" placeholder="Credits" class="gpa-input credit-val" value="3">
    <select class="gpa-select grade-val">
      <option value="4.00">A</option><option value="3.70">A-</option>
      <option value="3.30">B+</option><option value="3.00">B</option>
      <option value="2.00">C</option><option value="0.00">F</option>
    </select>
    <button class="btn-remove" onclick="removeRow(this)">×</button>`;
  document.getElementById('gpa-container').appendChild(r);
  r.querySelector('.credit-val').addEventListener('input', calcGPA);
  r.querySelector('.grade-val').addEventListener('change', calcGPA);
  calcGPA();
}

function removeRow(b) {
  if(document.querySelectorAll('.gpa-row').length > 1) { b.parentElement.remove(); calcGPA(); }
}

// Initial Events
document.querySelectorAll('.credit-val').forEach(el => el.addEventListener('input', calcGPA));
document.querySelectorAll('.grade-val').forEach(el => el.addEventListener('change', calcGPA));

// Loader & UI
window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('loader').classList.add('hide'), 1000);
});

window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('progress-bar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  document.getElementById('back-top').classList.toggle('show', h.scrollTop > 300);
});
</script>
</body>
</html>
