<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tharindu Buddhika | Academic Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  /* === THEME VARIABLES === */
  :root[data-theme="dark"] {
    --gold: #c9a84c;
    --gold-light: #e8c96e;
    --bg-main: #0d0d0d;
    --bg-gradient: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,0.07) 0%, transparent 60%), radial-gradient(ellipse 60% 80% at 85% 80%, rgba(201,168,76,0.05) 0%, transparent 55%);
    --card: #141414;
    --card-hover: #1c1c1c;
    --border: rgba(201,168,76,0.18);
    --text: #e8e2d6;
    --text-white: #ffffff;
    --muted: #888888;
    --shadow: rgba(0,0,0,0.5);
  }

  :root[data-theme="light"] {
    --gold: #aa862c;
    --gold-light: #c9a84c;
    --bg-main: #fcfbfa;
    --bg-gradient: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,0.05) 0%, transparent 60%), radial-gradient(ellipse 60% 80% at 85% 80%, rgba(201,168,76,0.03) 0%, transparent 55%);
    --card: #ffffff;
    --card-hover: #f7f5f0;
    --border: rgba(201,168,76,0.25);
    --text: #2c2a27;
    --text-white: #111111;
    --muted: #6e6a64;
    --shadow: rgba(201,168,76,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-main);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: var(--bg-gradient);
    pointer-events: none;
    z-index: 0;
  }

  /* === HEADER & CONTROLS === */
  header {
    position: relative;
    z-index: 10;
    padding: 60px 40px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    background: linear-gradient(180deg, rgba(201,168,76,0.03) 0%, transparent 100%);
  }

  .badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid var(--border);
    padding: 5px 14px;
    border-radius: 4px;
    margin-bottom: 18px;
    background: rgba(201,168,76,0.05);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 900;
    line-height: 1.05;
    color: var(--text-white);
    letter-spacing: -0.5px;
  }

  h1 span { color: var(--gold); display: block; }
  .subtitle { margin-top: 10px; font-size: 13px; color: var(--muted); letter-spacing: 0.5px; }

  /* === THEME TOGGLE BUTTON === */
  .theme-switch-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
  }

  .theme-toggle-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--gold);
    padding: 8px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-radius: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 12px var(--shadow);
    transition: all 0.3s ease;
  }

  .theme-toggle-btn:hover {
    transform: translateY(-2px);
    border-color: var(--gold-light);
    background: var(--card-hover);
  }

  .student-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 28px;
    text-align: right;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px var(--shadow);
    transition: background 0.4s ease, border 0.4s ease;
  }

  .student-card .label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; font-family: 'DM Mono', monospace; }
  .student-card .value { font-family: 'DM Mono', monospace; font-size: 14px; color: var(--gold); font-weight: 500; }
  .student-card .name-val { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text-white); font-weight: 700; margin-bottom: 6px; }

  /* === STATS BAR === */
  .stats-bar { position: relative; z-index: 10; display: flex; border-bottom: 1px solid var(--border); background: var(--bg-main); transition: background 0.4s ease; }
  .stat-item { flex: 1; padding: 20px 28px; border-right: 1px solid var(--border); text-align: center; }
  .stat-item:last-child { border-right: none; }
  .stat-num { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; color: var(--gold); line-height: 1; }
  .stat-label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 4px; font-family: 'DM Mono', monospace; }

  /* === FILTER BAR === */
  .filter-bar { position: relative; z-index: 10; padding: 24px 40px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); }
  .filter-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-family: 'DM Mono', monospace; margin-right: 6px; }
  .filter-btn { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px; padding: 6px 16px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.07); }

  /* === MAIN GRID === */
  main { position: relative; z-index: 10; padding: 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .sem-header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin-top: 16px; margin-bottom: 4px; }
  .sem-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sem-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700; color: var(--text-white); }
  .sem-title small { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-left: 10px; }
  .sem-line { flex: 1; height: 1px; background: var(--border); }

  /* === SUBJECT CARD === */
  .subject-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 22px 18px;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(.22,.68,0,1.2), box-shadow 0.25s, border-color 0.2s, background 0.4s ease;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    box-shadow: 0 4px 12px var(--shadow);
  }

  .subject-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 35px var(--shadow);
    border-color: var(--gold);
    background: var(--card-hover);
  }

  .card-code { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .card-title { font-family: 'Playfair Display', serif; font-size: 1.05rem; font-weight: 700; color: var(--text-white); line-height: 1.3; flex: 1; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .card-tag { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-family: 'DM Mono', monospace; padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); }
  .card-arrow { font-size: 16px; color: var(--gold); opacity: 0; transform: translateX(-6px); transition: all 0.2s; }
  .subject-card:hover .card-arrow { opacity: 1; transform: translateX(0); }

  .elective-badge {
    position: absolute;
    top: 12px; right: 12px;
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(201,168,76,0.1);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* === FOOTER === */
  footer { position: relative; z-index: 10; padding: 30px 40px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; background: var(--bg-main); transition: background 0.4s ease; }
  .footer-brand { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--gold); }
  .footer-note { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }

  @media (max-width: 600px) {
    header { padding: 36px 20px 28px; }
    main { padding: 20px; gap: 14px; }
    .filter-bar { padding: 16px 20px; }
    .stats-bar { flex-wrap: wrap; }
    .stat-item { min-width: 50%; }
    footer { padding: 20px; flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="theme-switch-wrapper">
      <div class="badge">Personal Academic Portal</div>
      <!-- THEME TOGGLE BUTTON -->
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
      </button>
    </div>
    <h1>Tharindu <span>Buddhika</span></h1>
    <p class="subtitle">Bachelor of Business Administration &nbsp;·&nbsp; Module Index</p>
  </div>
  <div class="student-card">
    <div class="label">Full Name</div>
    <div class="name-val">Tharindu Buddhika</div>
    <div class="label" style="margin-top:10px;">Student ID</div>
    <div class="value">COM/BMgt-558/IFLS26-15/0001</div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-num">33</div><div class="stat-label">Total Modules</div></div>
  <div class="stat-item"><div class="stat-num">4</div><div class="stat-label">Years</div></div>
  <div class="stat-item"><div class="stat-num">8</div><div class="stat-label">Semesters</div></div>
  <div class="stat-item"><div class="stat-num">3</div><div class="stat-label">Electives</div></div>
</div>

<div class="filter-bar">
  <span class="filter-label">Filter:</span>
  <button class="filter-btn active" onclick="filterSem('all', this)">All</button>
  <button class="filter-btn" onclick="filterSem('year1', this)">Year 1</button>
  <button class="filter-btn" onclick="filterSem('year2', this)">Year 2</button>
  <button class="filter-btn" onclick="filterSem('year3', this)">Year 3</button>
  <button class="filter-btn" onclick="filterSem('year4', this)">Year 4</button>
  <button class="filter-btn" onclick="filterSem('elective', this)">Electives</button>
</div>

<main id="main-grid"></main>

<footer>
  <div class="footer-brand">TB Academic Index</div>
  <div class="footer-note">Personal Use Only &nbsp;·&nbsp; COM/BMgt-558/IFLS26-15/0001</div>
</footer>

<script>
// Data Set
const SEMESTERS = [
  {
    id: 'sem1', year: 'year1', label: 'Year 1 — Semester 1', color: '#c9a84c',
    subjects: [
      { code: 'MGBM1401', title: 'Management Fundamentals' },
      { code: 'MGBM1302', title: 'Business Mathematics for Decisions' },
      { code: 'MGBM1403', title: 'Introduction to Information & Communication Technology' },
      { code: 'MGBM1404', title: 'Soft Skills in Business Communication' },
      { code: 'MGBM1005', title: 'English Language for Business 1' },
    ]
  },
  {
    id: 'sem2', year: 'year1', label: 'Year 1 — Semester 2', color: '#4caf8c',
    subjects: [
      { code: 'MGBM1306', title: 'Microeconomics' },
      { code: 'MGBM1407', title: 'Marketing Management' },
      { code: 'MGBM1408', title: 'Financial Accounting' },
      { code: 'MGBM1409', title: 'Organizational Behaviour' },
      { code: 'MGBM1010', title: 'English Language for Business 2' },
    ]
  },
  {
    id: 'sem3', year: 'year2', label: 'Year 2 — Semester 3', color: '#9c6fe0',
    subjects: [
      { code: 'MGBM2411', title: 'Business Law' },
      { code: 'MGBM2412', title: 'Business Statistics' },
      { code: 'MGBM2413', title: 'Management Accounting' },
      { code: 'MGBM2314', title: 'Business Information Systems' },
    ]
  },
  {
    id: 'sem4', year: 'year2', label: 'Year 2 — Semester 4', color: '#5aad6e',
    subjects: [
      { code: 'MGBM2415', title: 'Managerial Economics' },
      { code: 'MGBM2416', title: 'Human Resource Management' },
      { code: 'MGBM2417', title: 'Finance Management' },
      { code: 'MGBM2318', title: 'Managerial Soft Skills' },
    ]
  },
  {
    id: 'sem5', year: 'year3', label: 'Year 3 — Semester 5', color: '#d46060',
    subjects: [
      { code: 'MGBM3419', title: 'Development Economics' },
      { code: 'MGBM3420', title: 'Strategic Marketing Management' },
      { code: 'MGBM3421', title: 'Supply Chain Management' },
      { code: 'MGBM3422', title: 'International Business Strategy' },
    ]
  },
  {
    id: 'sem6', year: 'year3', label: 'Year 3 — Semester 6', color: '#4a8ec2',
    subjects: [
      { code: 'MGBM3423', title: 'Strategic Brand Management' },
      { code: 'MGBM3424', title: 'Research Methodology' },
      { code: 'MGBM3325', title: 'Operations Management' },
      { code: 'MGBM3326', title: 'Corporate Social Responsibility & Ethics', elective: true },
      { code: 'MGBM3327', title: 'Entrepreneurship', elective: true },
      { code: 'MGBM3328', title: 'E-Commerce', elective: true },
    ]
  },
  {
    id: 'sem7', year: 'year4', label: 'Year 4 — Semester 7', color: '#e0a96d',
    subjects: [
      { code: 'MGBM4429', title: 'Strategic Management' },
      { code: 'MGBM4430', title: 'Strategic Finance' },
      { code: 'MGBM4631', title: 'Project Management' },
    ]
  },
  {
    id: 'sem8', year: 'year4', label: 'Year 4 — Semester 8', color: '#3eb8d0',
    subjects: [
      { code: 'MGBM4432', title: 'Academic Writing' },
      { code: 'MGBM4633', title: 'Dissertation' },
      { code: 'MGBM4634', title: 'Internship in Business Administration' },
    ]
  }
];

// Theme Switch Logic
function toggleTheme() {
  const root = document.documentElement;
  const currentTheme = root.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  
  root.setAttribute('data-theme', newTheme);
  updateThemeUI(newTheme);
}

function updateThemeUI(theme) {
  const icon = document.getElementById('themeIcon');
  const text = document.getElementById('themeText');
  
  if (theme === 'dark') {
    icon.textContent = '🌙';
    text.textContent = 'Dark Mode';
  } else {
    icon.textContent = '☀️';
    text.textContent = 'Light Mode';
  }
}

// Build Grid Function
function buildGrid(filter = 'all') {
  const grid = document.getElementById('main-grid');
  grid.innerHTML = '';

  SEMESTERS.forEach((sem, si) => {
    const subjects = filter === 'elective'
      ? sem.subjects.filter(s => s.elective)
      : sem.subjects;

    const yearMatch = filter === 'all' || filter === sem.year || filter === 'elective';
    if (!yearMatch || subjects.length === 0) return;

    // Semester header
    const hdr = document.createElement('div');
    hdr.className = 'sem-header';
    hdr.innerHTML = `
      <div class="sem-dot" style="background:${sem.color};box-shadow:0 0 8px ${sem.color}66;"></div>
      <div class="sem-title">${sem.label} <small>${sem.id.toUpperCase()}</small></div>
      <div class="sem-line"></div>
    `;
    grid.appendChild(hdr);

    // Subject cards
    subjects.forEach((sub, i) => {
      const card = document.createElement('a');
      card.className = 'subject-card';
      card.href = `subjects/${sub.code.toLowerCase()}.html`;
      card.style.borderTop = `2px solid ${sem.color}`;
      
      card.innerHTML = `
        ${sub.elective ? '<span class="elective-badge">Elective</span>' : ''}
        <div class="card-code">${sub.code}</div>
        <div class="card-title">${sub.title}</div>
        <div class="card-footer">
          <span class="card-tag" style="border-color:${sem.color}44;color:${sem.color};">${sem.id.replace('sem','Sem ')}</span>
          <span class="card-arrow">→</span>
        </div>
      `;
      grid.appendChild(card);
    });
  });
}

function filterSem(f, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildGrid(f);
}

// Initialize
buildGrid('all');
</script>
</body>
</html>
