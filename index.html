<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tharindu Buddhika | Premium Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;--card2:#faf8ff;
  --text:#1e1b4b;--text2:#4c1d95;--muted:#6d6a8a;
  --accent:#7c3aed;--accent2:#9333ea;--accent3:#a855f7;
  --border:rgba(124,58,237,0.15);--border2:rgba(124,58,237,0.3);
  --shadow:0 4px 24px rgba(124,58,237,0.12);
  --shadow2:0 8px 40px rgba(124,58,237,0.2);
  --red:#ef4444;--glass:rgba(255,255,255,0.7);
}
[data-theme="dark"]{
  --bg:#0d0b1e;--bg2:#110f2a;--card:#1a1730;--card2:#1f1c38;
  --text:#e9e4ff;--text2:#c4b5fd;--muted:#8b8aaa;
  --accent:#a78bfa;--accent2:#c084fc;--accent3:#d8b4fe;
  --border:rgba(167,139,250,0.15);--border2:rgba(167,139,250,0.3);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}

/* LOADER */
#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
.loader-ring{width:60px;height:60px;border:4px solid var(--border2);border-top:4px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* HEADER */
header{position:sticky;top:0;z-index:1000;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.header-logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.1rem;color:var(--accent)}
.header-right{display:flex;align-items:center;gap:8px}
.theme-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--accent);cursor:pointer;transition:all .3s}

/* GPA SECTION */
.gpa-section{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;box-shadow:var(--shadow)}
.gpa-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;margin-bottom:12px;align-items:center}
.gpa-input,.gpa-select{padding:11px 14px;border:1px solid var(--border2);border-radius:12px;background:var(--bg);color:var(--text);outline:none}
.btn-add{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px dashed var(--border2);background:transparent;color:var(--accent);cursor:pointer}
.btn-remove{width:36px;height:36px;border-radius:10px;background:rgba(239,68,68,.1);border:none;color:var(--red);cursor:pointer}
.gpa-result{margin-top:20px;padding:20px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.gpa-val{font-family:'JetBrains Mono',monospace;font-size:2.2rem;font-weight:700}

/* MODAL & UTILS */
.ai-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
.ai-overlay.active{opacity:1;pointer-events:auto}
.ai-modal{background:var(--card);padding:36px;max-width:480px;width:90%;border-radius:24px;text-align:center}
</style>
</head>
<body>

<div id="loader"><div class="loader-ring"></div></div>

<header>
  <div class="header-logo">MY INDEX</div>
  <div class="header-right">
    <button class="theme-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
  </div>
</header>

<main style="max-width:800px;margin:50px auto;padding:20px">
  <section class="gpa-section">
    <h3 style="margin-bottom:20px">GPA Calculator</h3>
    <div id="gpa-container">
      <div class="gpa-row">
        <input type="text" placeholder="Subject" class="gpa-input">
        <input type="number" placeholder="Credits" class="gpa-input credit-val" value="3">
        <select class="gpa-select grade-val">
          <option value="4.00">A</option><option value="3.70">A-</option>
          <option value="3.30">B+</option><option value="3.00">B</option>
          <option value="2.00">C</option><option value="0.00">F</option>
        </select>
        <button class="btn-remove" onclick="this.parentElement.remove();calcGPA()">×</button>
      </div>
    </div>
    <button class="btn-add" onclick="addRow()"><i class="fas fa-plus"></i> Add Subject</button>
    <div class="gpa-result">
      <div><strong>Your GPA</strong></div>
      <div class="gpa-val" id="gpa-display">0.00</div>
    </div>
  </section>
</main>

<script>
// Theme Toggle
const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  themeBtn.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
});

// GPA Logic
function calcGPA() {
  let tc = 0, tp = 0;
  document.querySelectorAll('.gpa-row').forEach(r => {
    const c = parseFloat(r.querySelector('.credit-val').value) || 0;
    const g = parseFloat(r.querySelector('.grade-val').value) || 0;
    tc += c; tp += c * g;
  });
  document.getElementById('gpa-display').textContent = tc > 0 ? (tp / tc).toFixed(2) : '0.00';
}

function addRow() {
  const div = document.createElement('div');
  div.className = 'gpa-row';
  div.innerHTML = `
    <input type="text" placeholder="Subject" class="gpa-input">
    <input type="number" placeholder="Credits" class="gpa-input credit-val" value="3">
    <select class="gpa-select grade-val">
      <option value="4.00">A</option><option value="3.70">A-</option>
      <option value="3.30">B+</option><option value="3.00">B</option>
      <option value="2.00">C</option><option value="0.00">F</option>
    </select>
    <button class="btn-remove" onclick="this.parentElement.remove();calcGPA()">×</button>`;
  document.getElementById('gpa-container').appendChild(div);
}

// Global Event listener for auto-calc
document.addEventListener('input', calcGPA);

window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('loader').classList.add('hide'), 500);
});
</script>

</body>
</html>
