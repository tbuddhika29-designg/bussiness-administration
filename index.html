<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Tharindu Buddhika | Premium Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        :root { --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;--card2:#faf8ff; --text:#1e1b4b;--text2:#4c1d95;--muted:#6d6a8a; --accent:#7c3aed;--accent2:#9333ea;--accent3:#a855f7; --border:rgba(124,58,237,0.15);--border2:rgba(124,58,237,0.3); --shadow:0 4px 24px rgba(124,58,237,0.12); --shadow2:0 8px 40px rgba(124,58,237,0.2); --gold:#f59e0b;--green:#10b981;--red:#ef4444; --glass:rgba(255,255,255,0.7);--glass-border:rgba(124,58,237,0.2); }
        [data-theme="dark"]{ --bg:#0d0b1e;--bg2:#110f2a;--card:#1a1730;--card2:#1f1c38; --text:#e9e4ff;--text2:#c4b5fd;--muted:#8b8aaa; --accent:#a78bfa;--accent2:#c084fc;--accent3:#d8b4fe; --border:rgba(167,139,250,0.15);--border2:rgba(167,139,250,0.3); --shadow:0 4px 24px rgba(0,0,0,0.4); --shadow2:0 8px 40px rgba(124,58,237,0.25); --glass:rgba(26,23,48,0.8);--glass-border:rgba(167,139,250,0.2); }
        
        /* අමතර පන්තිය: Admin Button Style */
        .admin-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: all 0.3s ease; }
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }

        /* ඔබේ පවතින CSS මෙතැනට පහළින් තබන්න... */
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}

        /* [ඉතිරි CSS කොටස් කලින් තිබූ පරිදිම තබා ගන්න] */
        #loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s}
        #loader.hide{opacity:0;pointer-events:none}
        .loader-ring{width:60px;height:60px;border:4px solid var(--border2);border-top:4px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        header{position:sticky;top:0;z-index:1000;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow)}
        .header-left{display:flex;align-items:center;gap:12px}
        .header-logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.1rem;color:var(--accent)}
        .header-right{display:flex;align-items:center;gap:12px}
        .theme-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
        .theme-btn:hover{background:var(--accent);color:#fff}
        
        main{max-width:1100px;margin:0 auto;padding:48px 20px 100px}
        .hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
        .hub-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;text-decoration:none;display:flex;flex-direction:column;gap:14px;transition:transform .3s;cursor:pointer;color:inherit}
        .hub-card:hover{transform:translateY(-5px);border-color:var(--accent)}
        .hub-icon{width:52px;height:52px;border-radius:14px;background:rgba(124,58,237,.1);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--accent)}
    </style>
</head>
<body>

<div id="loader"><div class="loader-ring"></div></div>

<header>
  <div class="header-left">
    <div class="header-logo">TB Index</div>
  </div>
  <div class="header-right">
    <button class="theme-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
    <a href="admin-panel.html" style="display:none;" id="admin-link" class="admin-btn">
       <i class="fas fa-shield-halved"></i> Admin
    </a>
  </div>
</header>

<main>
    </main>

<script>
    // Theme logic
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        themeBtn.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        localStorage.setItem('ict-theme', isDark ? 'light' : 'dark');
    });
</script>

<script type="module">
    import { auth } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

    const ADMIN_UID = "YxH8AiPQ5dbyUKm85TjJgJDVj1S2";

    onAuthStateChanged(auth, (user) => {
        const adminLink = document.getElementById('admin-link');
        if (user && user.uid === ADMIN_UID) {
            adminLink.style.display = 'inline-flex';
        } else {
            adminLink.style.display = 'none';
        }
    });
</script>
</body>
</html>
