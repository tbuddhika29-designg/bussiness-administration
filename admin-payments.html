<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Approve Payments | MY Index Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;
  --text:#1e1b4b;--muted:#6d6a8a;
  --accent:#7c3aed;--accent2:#9333ea;--accent3:#a855f7;
  --border:rgba(124,58,237,0.15);--border2:rgba(124,58,237,0.3);
  --shadow:0 4px 24px rgba(124,58,237,0.12);
  --shadow2:0 8px 40px rgba(124,58,237,0.22);
  --red:#ef4444;--green:#10b981;--yellow:#f59e0b;
  --glass:rgba(255,255,255,0.7);
}
[data-theme="dark"]{
  --bg:#0d0b1e;--bg2:#110f2a;--card:#1a1730;
  --text:#e9e4ff;--muted:#8b8aaa;
  --accent:#a78bfa;--accent2:#c084fc;--accent3:#d8b4fe;
  --border:rgba(167,139,250,0.15);--border2:rgba(167,139,250,0.3);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow2:0 8px 40px rgba(124,58,237,0.25);
  --glass:rgba(26,23,48,0.85);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;padding:20px}

.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;border-radius:50%;opacity:.12;animation:floatBubble linear infinite}
[data-theme="dark"] .bubble{opacity:.07}
@keyframes floatBubble{0%{transform:translateY(110vh) scale(0)}50%{opacity:.15}100%{transform:translateY(-10vh) scale(1);opacity:0}}

.theme-btn{position:fixed;top:20px;right:20px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--accent);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:var(--shadow)}
.theme-btn:hover{background:var(--accent);color:#fff;transform:scale(1.1)}

.wrapper{position:relative;z-index:10;max-width:1100px;margin:0 auto;animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* HEADER */
.page-header{display:flex;align-items:center;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:100px;border:1px solid var(--border2);background:transparent;color:var(--accent);cursor:pointer;font-size:.85rem;font-weight:600;text-decoration:none;transition:all .3s}
.back-btn:hover{background:var(--accent);color:#fff}
.page-title{font-family:'Poppins',sans-serif;font-size:1.8rem;font-weight:800}
.page-sub{font-size:.9rem;color:var(--muted);margin-top:4px}

/* FILTERS */
.filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:8px 18px;border-radius:100px;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-size:.82rem;font-weight:600;transition:all .3s}
.filter-btn.active,.filter-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border2);border-radius:100px;padding:8px 16px;flex:1;min-width:200px;max-width:320px}
.search-box i{color:var(--muted);font-size:.9rem}
.search-box input{border:none;background:transparent;outline:none;color:var(--text);font-size:.85rem;width:100%}
.search-box input::placeholder{color:var(--muted)}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:28px}
.mini-stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.mini-stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.mini-stat-icon.yellow{background:rgba(245,158,11,.15);color:var(--yellow)}
.mini-stat-icon.green{background:rgba(16,185,129,.15);color:var(--green)}
.mini-stat-icon.red{background:rgba(239,68,68,.15);color:var(--red)}
.mini-stat-icon.purple{background:rgba(124,58,237,.15);color:var(--accent)}
.mini-stat-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.mini-stat-value{font-family:'Poppins',sans-serif;font-size:1.5rem;font-weight:800;color:var(--text)}

/* TABLE */
.table-card{background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.table-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.table-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:1rem}
.refresh-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:100px;border:1px solid var(--border2);background:transparent;color:var(--accent);cursor:pointer;font-size:.8rem;font-weight:600;transition:all .3s}
.refresh-btn:hover{background:var(--accent);color:#fff}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{padding:12px 16px;text-align:left;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--bg2);border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid var(--border);transition:background .2s}
tbody tr:hover{background:rgba(124,58,237,.04)}
tbody tr:last-child{border-bottom:none}
td{padding:14px 16px;font-size:.84rem;vertical-align:middle}
.td-name{font-weight:600;color:var(--text)}
.td-email{color:var(--muted);font-size:.8rem}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:100px;font-size:.72rem;font-weight:700;text-transform:uppercase}
.badge.pending{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:var(--yellow)}
.badge.approved{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:var(--green)}
.badge.rejected{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--red)}

/* ACTION BTNS */
.action-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn-approve{padding:6px 14px;border-radius:100px;border:none;background:var(--green);color:#fff;cursor:pointer;font-size:.78rem;font-weight:700;transition:all .3s;display:flex;align-items:center;gap:5px}
.btn-approve:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(16,185,129,.4)}
.btn-reject{padding:6px 14px;border-radius:100px;border:1px solid rgba(239,68,68,.4);background:transparent;color:var(--red);cursor:pointer;font-size:.78rem;font-weight:700;transition:all .3s;display:flex;align-items:center;gap:5px}
.btn-reject:hover{background:var(--red);color:#fff}
.btn-view{padding:6px 14px;border-radius:100px;border:1px solid var(--border2);background:transparent;color:var(--accent);cursor:pointer;font-size:.78rem;font-weight:600;transition:all .3s;display:flex;align-items:center;gap:5px}
.btn-view:hover{background:var(--accent);color:#fff}

/* AVATAR */
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.9rem;flex-shrink:0}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state i{font-size:3rem;margin-bottom:16px;opacity:.4;display:block}
.empty-state p{font-size:.9rem}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:24px;padding:32px;max-width:520px;width:100%;box-shadow:var(--shadow2);animation:modalIn .3s cubic-bezier(.16,1,.3,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.modal-title{font-family:'Poppins',sans-serif;font-size:1.2rem;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;transition:all .3s}
.modal-close:hover{background:var(--red);color:#fff;border-color:var(--red)}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.modal-row:last-of-type{border-bottom:none}
.modal-label{font-size:.8rem;color:var(--muted);font-weight:600}
.modal-value{font-size:.88rem;font-weight:600;text-align:right}
.modal-proof{width:100%;border-radius:12px;border:1px solid var(--border);margin:16px 0;max-height:300px;object-fit:contain;display:block;background:var(--bg2)}
.modal-actions{display:flex;gap:12px;margin-top:20px}
.modal-actions .btn-approve{flex:1;justify-content:center;padding:12px}
.modal-actions .btn-reject{flex:1;justify-content:center;padding:12px}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border2);border-radius:100px;padding:12px 24px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow2);z-index:300;opacity:0;transition:all .3s;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(16,185,129,.4);color:var(--green)}
.toast.error{border-color:rgba(239,68,68,.4);color:var(--red)}

/* LOADING */
.loading-row td{text-align:center;padding:40px;color:var(--muted)}
.spinner{display:inline-block;width:24px;height:24px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .filters{flex-direction:column;align-items:flex-start}
  .search-box{max-width:100%;width:100%}
  .action-btns{flex-direction:column}
  .btn-approve,.btn-reject,.btn-view{font-size:.75rem}
}
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>
<button class="theme-btn" id="themeBtn"><i class="fas fa-moon"></i></button>

<div class="wrapper">
  <div class="page-header">
    <a href="admin-panel.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Panel</a>
    <div>
      <div class="page-title"><i class="fas fa-credit-card" style="color:var(--accent);margin-right:10px"></i>Payment Approvals</div>
      <div class="page-sub">Review and approve pending student payment submissions</div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="mini-stat">
      <div class="mini-stat-icon yellow"><i class="fas fa-hourglass-half"></i></div>
      <div>
        <div class="mini-stat-label">Pending</div>
        <div class="mini-stat-value" id="s-pending">—</div>
      </div>
    </div>
    <div class="mini-stat">
      <div class="mini-stat-icon green"><i class="fas fa-check-circle"></i></div>
      <div>
        <div class="mini-stat-label">Approved</div>
        <div class="mini-stat-value" id="s-approved">—</div>
      </div>
    </div>
    <div class="mini-stat">
      <div class="mini-stat-icon red"><i class="fas fa-times-circle"></i></div>
      <div>
        <div class="mini-stat-label">Rejected</div>
        <div class="mini-stat-value" id="s-rejected">—</div>
      </div>
    </div>
    <div class="mini-stat">
      <div class="mini-stat-icon purple"><i class="fas fa-users"></i></div>
      <div>
        <div class="mini-stat-label">Total</div>
        <div class="mini-stat-value" id="s-total">—</div>
      </div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <button class="filter-btn active" data-filter="pending">⏳ Pending</button>
    <button class="filter-btn" data-filter="approved">✅ Approved</button>
    <button class="filter-btn" data-filter="rejected">❌ Rejected</button>
    <button class="filter-btn" data-filter="all">📋 All</button>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search by name or email..."/>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <div class="table-header">
      <div class="table-title">Payment Records</div>
      <button class="refresh-btn" id="refreshBtn"><i class="fas fa-rotate-right"></i> Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Amount</th>
            <th>Plan</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="payments-tbody">
          <tr class="loading-row">
            <td colspan="6"><div class="spinner"></div><br>Loading payments...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Payment Details</div>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toast-text"></span></div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
import {
  collection, query, where, getDocs, doc, getDoc,
  updateDoc, orderBy, serverTimestamp, Timestamp
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const ADMIN_UID = "VQO3ENwqo5O4XYakBi2bGC4R8uB3";

let allPayments = [];
let currentFilter = 'pending';
let currentModal = null;

// Auth check
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists() || snap.data().role !== 'admin') {
    window.location.href = 'index.html'; return;
  }
  loadPayments();
});

async function loadPayments() {
  try {
    const tbody = document.getElementById('payments-tbody');
    tbody.innerHTML = `<tr class="loading-row"><td colspan="6"><div class="spinner"></div><br>Loading...</td></tr>`;

    // Load users with paymentPending or paymentStatus field
    const usersSnap = await getDocs(collection(db, "users"));
    allPayments = [];

    usersSnap.forEach(d => {
      const data = d.data();
      // Include users who have submitted any payment info
      if (data.paymentPending !== undefined || data.paymentStatus || data.paymentProof || data.paymentSubmittedAt) {
        allPayments.push({ id: d.id, ...data });
      }
    });

    updateStats();
    renderTable();
  } catch (err) {
    console.error(err);
    showToast('Error loading payments', 'error');
  }
}

function updateStats() {
  const pending = allPayments.filter(p => p.paymentPending === true || p.paymentStatus === 'pending').length;
  const approved = allPayments.filter(p => p.paymentStatus === 'approved' || p.approved === true).length;
  const rejected = allPayments.filter(p => p.paymentStatus === 'rejected').length;
  document.getElementById('s-pending').textContent = pending;
  document.getElementById('s-approved').textContent = approved;
  document.getElementById('s-rejected').textContent = rejected;
  document.getElementById('s-total').textContent = allPayments.length;
}

function renderTable() {
  const tbody = document.getElementById('payments-tbody');
  const search = document.getElementById('searchInput').value.toLowerCase();

  let filtered = allPayments.filter(p => {
    const matchSearch = !search ||
      (p.name || '').toLowerCase().includes(search) ||
      (p.email || '').toLowerCase().includes(search);

    let matchFilter = true;
    if (currentFilter === 'pending') matchFilter = p.paymentPending === true || p.paymentStatus === 'pending';
    else if (currentFilter === 'approved') matchFilter = p.paymentStatus === 'approved' || (p.approved && !p.paymentPending);
    else if (currentFilter === 'rejected') matchFilter = p.paymentStatus === 'rejected';

    return matchSearch && matchFilter;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6">
      <div class="empty-state">
        <i class="fas fa-inbox"></i>
        <p>No ${currentFilter} payments found</p>
      </div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(p => {
    const initials = (p.name || p.email || '?').charAt(0).toUpperCase();
    const status = getStatus(p);
    const date = p.paymentSubmittedAt
      ? (p.paymentSubmittedAt.toDate ? p.paymentSubmittedAt.toDate().toLocaleDateString() : new Date(p.paymentSubmittedAt).toLocaleDateString())
      : p.createdAt
        ? (p.createdAt.toDate ? p.createdAt.toDate().toLocaleDateString() : new Date(p.createdAt).toLocaleDateString())
        : '—';

    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="avatar">${initials}</div>
          <div>
            <div class="td-name">${p.name || 'Unknown'}</div>
            <div class="td-email">${p.email || ''}</div>
          </div>
        </div>
      </td>
      <td style="font-weight:700;color:var(--accent)">${p.paymentAmount ? 'Rs. ' + p.paymentAmount : '—'}</td>
      <td style="color:var(--muted)">${p.plan || p.subscriptionPlan || '—'}</td>
      <td style="color:var(--muted)">${date}</td>
      <td><span class="badge ${status.cls}"><i class="fas ${status.icon}"></i> ${status.label}</span></td>
      <td>
        <div class="action-btns">
          <button class="btn-view" onclick="window.viewPayment('${p.id}')"><i class="fas fa-eye"></i> View</button>
          ${status.cls === 'pending' ? `
            <button class="btn-approve" onclick="window.approvePayment('${p.id}')"><i class="fas fa-check"></i> Approve</button>
            <button class="btn-reject" onclick="window.rejectPayment('${p.id}')"><i class="fas fa-times"></i> Reject</button>
          ` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function getStatus(p) {
  if (p.paymentStatus === 'approved' || (p.approved && !p.paymentPending))
    return { cls: 'approved', label: 'Approved', icon: 'fa-check-circle' };
  if (p.paymentStatus === 'rejected')
    return { cls: 'rejected', label: 'Rejected', icon: 'fa-times-circle' };
  return { cls: 'pending', label: 'Pending', icon: 'fa-hourglass-half' };
}

window.viewPayment = async (uid) => {
  const p = allPayments.find(x => x.id === uid);
  if (!p) return;
  currentModal = uid;

  const status = getStatus(p);
  const date = p.paymentSubmittedAt
    ? (p.paymentSubmittedAt.toDate ? p.paymentSubmittedAt.toDate().toLocaleString() : new Date(p.paymentSubmittedAt).toLocaleString())
    : '—';

  document.getElementById('modal-body').innerHTML = `
    <div class="modal-row"><span class="modal-label">Name</span><span class="modal-value">${p.name || '—'}</span></div>
    <div class="modal-row"><span class="modal-label">Email</span><span class="modal-value">${p.email || '—'}</span></div>
    <div class="modal-row"><span class="modal-label">Plan</span><span class="modal-value">${p.plan || p.subscriptionPlan || '—'}</span></div>
    <div class="modal-row"><span class="modal-label">Amount</span><span class="modal-value" style="color:var(--accent);font-size:1rem">${p.paymentAmount ? 'Rs. ' + p.paymentAmount : '—'}</span></div>
    <div class="modal-row"><span class="modal-label">Submitted</span><span class="modal-value">${date}</span></div>
    <div class="modal-row"><span class="modal-label">Status</span><span class="badge ${status.cls}" style="font-size:.75rem"><i class="fas ${status.icon}"></i> ${status.label}</span></div>
    <div class="modal-row"><span class="modal-label">Payment Reference</span><span class="modal-value">${p.paymentRef || p.transactionId || '—'}</span></div>
    ${p.paymentProof ? `<div style="margin-top:12px"><div class="modal-label" style="margin-bottom:8px">Payment Proof / Slip</div><img src="${p.paymentProof}" class="modal-proof" alt="Payment Proof"/></div>` : '<p style="color:var(--muted);font-size:.82rem;text-align:center;padding:16px">No payment proof uploaded</p>'}
  `;

  document.getElementById('modal-actions').innerHTML = status.cls === 'pending' ? `
    <button class="btn-approve" style="flex:1;justify-content:center;padding:12px" onclick="window.approvePayment('${uid}');closeModal()">
      <i class="fas fa-check"></i> Approve Payment
    </button>
    <button class="btn-reject" style="flex:1;justify-content:center;padding:12px" onclick="window.rejectPayment('${uid}');closeModal()">
      <i class="fas fa-times"></i> Reject
    </button>
  ` : '';

  document.getElementById('modal').classList.add('show');
};

window.approvePayment = async (uid) => {
  try {
    await updateDoc(doc(db, "users", uid), {
      paymentPending: false,
      paymentStatus: 'approved',
      approved: true,
      paymentApprovedAt: serverTimestamp(),
      subscriptionActive: true
    });
    const idx = allPayments.findIndex(x => x.id === uid);
    if (idx !== -1) {
      allPayments[idx].paymentPending = false;
      allPayments[idx].paymentStatus = 'approved';
      allPayments[idx].approved = true;
    }
    updateStats();
    renderTable();
    showToast('Payment approved successfully!', 'success');
  } catch (err) {
    console.error(err);
    showToast('Error approving payment', 'error');
  }
};

window.rejectPayment = async (uid) => {
  if (!confirm('Are you sure you want to reject this payment?')) return;
  try {
    await updateDoc(doc(db, "users", uid), {
      paymentPending: false,
      paymentStatus: 'rejected',
      approved: false,
      paymentRejectedAt: serverTimestamp()
    });
    const idx = allPayments.findIndex(x => x.id === uid);
    if (idx !== -1) {
      allPayments[idx].paymentPending = false;
      allPayments[idx].paymentStatus = 'rejected';
    }
    updateStats();
    renderTable();
    showToast('Payment rejected.', 'error');
  } catch (err) {
    console.error(err);
    showToast('Error rejecting payment', 'error');
  }
};

window.closeModal = () => document.getElementById('modal').classList.remove('show');

document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTable();
  });
});

document.getElementById('searchInput').addEventListener('input', renderTable);
document.getElementById('refreshBtn').addEventListener('click', loadPayments);

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  const ti = document.getElementById('toast-text');
  ti.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>

<script>
const saved = localStorage.getItem('ict-theme') || 'light';
if (saved === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('themeBtn').innerHTML = '<i class="fas fa-sun"></i>';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const d = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
  document.getElementById('themeBtn').innerHTML = d ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
  localStorage.setItem('ict-theme', d ? 'light' : 'dark');
});
function createBubbles() {
  const w = document.getElementById('bubbles');
  const cols = ['#7c3aed','#9333ea','#a855f7','#c084fc','#6d28d9'];
  for (let i = 0; i < 12; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const sz = Math.random() * 80 + 30;
    b.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-duration:${10+Math.random()*20}s;animation-delay:${Math.random()*12}s;`;
    w.appendChild(b);
  }
}
createBubbles();
</script>
