<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Payment Approvals | MY Index Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;
  --text:#1e1b4b;--muted:#6d6a8a;
  --accent:#7c3aed;--accent2:#9333ea;--accent3:#a855f7;
  --border:rgba(124,58,237,0.15);--border2:rgba(124,58,237,0.3);
  --shadow:0 4px 24px rgba(124,58,237,0.12);
  --shadow2:0 8px 40px rgba(124,58,237,0.22);
  --green:#10b981;--red:#ef4444;
  --glass:rgba(255,255,255,0.7);
}
[data-theme="dark"]{
  --bg:#0d0b1e;--bg2:#110f2a;--card:#1a1730;
  --text:#e9e4ff;--muted:#8b8aaa;
  --accent:#a78bfa;--accent2:#c084fc;--accent3:#d8b4fe;
  --border:rgba(167,139,250,0.15);--border2:rgba(167,139,250,0.3);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow2:0 8px 40px rgba(124,58,237,0.25);
  --glass:rgba(26,23,48,0.85);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;padding:20px}

/* HEADER */
header{position:sticky;top:20px;z-index:1000;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);padding:16px 24px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);margin-bottom:32px}
.admin-title{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.2rem;color:var(--accent)}
.logout-btn{padding:8px 16px;border:none;border-radius:100px;background:linear-gradient(135deg,var(--red),#dc2626);color:#fff;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .3s}
.logout-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(239,68,68,.3)}

/* CONTAINER */
.admin-container{max-width:1100px;margin:0 auto}

/* SECTION */
.section-title{font-family:'Poppins',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(124,58,237,.15);padding:6px 14px;border-radius:100px;font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}

/* PAYMENT CARD */
.payment-card{background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:16px;padding:24px;margin-bottom:16px;display:grid;grid-template-columns:1fr 2fr 1fr;gap:24px;align-items:center;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

.payment-card:hover{border-color:var(--accent);box-shadow:var(--shadow2)}

/* STUDENT INFO */
.student-info{display:flex;gap:12px;align-items:flex-start}
.student-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0}
.student-details{flex:1}
.student-name{font-family:'Poppins',sans-serif;font-weight:700;color:var(--text);margin-bottom:4px}
.student-email{font-size:.8rem;color:var(--muted)}
.student-plan{font-size:.75rem;background:rgba(124,58,237,.1);padding:3px 8px;border-radius:4px;display:inline-block;margin-top:4px;color:var(--accent);font-weight:600}

/* PAYMENT DETAILS */
.payment-details{display:flex;flex-direction:column;gap:12px}
.detail-row{display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
.detail-label{color:var(--muted)}
.detail-value{font-family:'Poppins',sans-serif;font-weight:700;color:var(--text)}
.detail-value.amount{font-size:1.2rem;color:var(--accent)}
.detail-value.date{font-size:.8rem;color:var(--muted)}
.status-badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:6px 12px;border-radius:100px;font-weight:600;background:rgba(245,158,11,.15);color:#f59e0b;text-transform:uppercase;letter-spacing:.05em}

/* ACTIONS */
.payment-actions{display:flex;gap:10px;justify-content:flex-end}
.action-btn{padding:10px 16px;border:none;border-radius:12px;cursor:pointer;font-size:.85rem;font-weight:600;transition:all .3s;font-family:'Poppins',sans-serif}
.approve-btn{background:linear-gradient(135deg,var(--green),#059669);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3)}
.approve-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,185,129,.4)}
.reject-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--red)}
.reject-btn:hover{background:var(--red);color:#fff}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:16px}

/* ALERT */
.alert{padding:12px 16px;border-radius:10px;font-size:.84rem;font-weight:500;display:flex;align-items:center;gap:10px;margin-bottom:16px}
.alert.success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:var(--green)}

@media(max-width:768px){
  .payment-card{grid-template-columns:1fr;gap:16px}
  .payment-actions{justify-content:flex-start}
}
</style>
</head>
<body>

<header>
  <div class="admin-title"><i class="fas fa-shield-alt"></i> Admin Panel</div>
  <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
</header>

<div class="admin-container">
  <div class="section-title">
    <span class="badge"><i class="fas fa-clock"></i> Pending</span>
    Payment Approvals
  </div>

  <div id="alert-box"></div>

  <div id="payments-container">
    <!-- Dynamically loaded payments -->
  </div>

  <div id="empty-state" style="display:none">
    <div class="empty-state">
      <div class="empty-icon"><i class="fas fa-check-circle"></i></div>
      <p>No pending payments to review</p>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
import { collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

// Admin only check
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);
    
    if (!userSnap.exists() || userSnap.data().role !== 'admin') {
      window.location.href = 'dashboard.html';
      return;
    }

    // Load pending payments
    loadPendingPayments();
  } catch (error) {
    console.error('Error:', error);
  }
});

async function loadPendingPayments() {
  try {
    const q = query(
      collection(db, "users"),
      where("paymentPending", "==", true),
      where("subscriptionActive", "==", false)
    );
    
    const querySnapshot = await getDocs(q);
    const container = document.getElementById('payments-container');
    const emptyState = document.getElementById('empty-state');

    if (querySnapshot.empty) {
      emptyState.style.display = 'block';
      container.innerHTML = '';
      return;
    }

    emptyState.style.display = 'none';
    container.innerHTML = '';

    querySnapshot.forEach((docSnap) => {
      const userData = docSnap.data();
      const card = createPaymentCard(docSnap.id, userData);
      container.appendChild(card);
    });

  } catch (error) {
    console.error('Error loading payments:', error);
    showAlert('Error loading payments', 'error');
  }
}

function createPaymentCard(userId, userData) {
  const card = document.createElement('div');
  card.className = 'payment-card';

  const planNames = {
    monthly: 'Monthly',
    semester: 'Semester',
    annual: 'Annual'
  };

  const paymentMethods = {
    card: '💳 Card',
    bank: '🏦 Bank Transfer',
    mobile: '📱 Mobile Money'
  };

  const avatar = userData.displayName?.charAt(0).toUpperCase() || 'S';
  const date = userData.paymentDate ? new Date(userData.paymentDate.seconds * 1000).toLocaleDateString() : '-';

  card.innerHTML = `
    <div class="student-info">
      <div class="student-avatar">${avatar}</div>
      <div class="student-details">
        <div class="student-name">${userData.displayName || 'Student'}</div>
        <div class="student-email">${userData.email}</div>
        <div class="student-plan">${planNames[userData.subscriptionPlan] || userData.subscriptionPlan}</div>
      </div>
    </div>

    <div class="payment-details">
      <div class="detail-row">
        <span class="detail-label">Amount</span>
        <span class="detail-value amount">LKR ${userData.paidAmount?.toLocaleString() || '0'}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Method</span>
        <span class="detail-value">${paymentMethods[userData.paymentMethod] || userData.paymentMethod}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Date</span>
        <span class="detail-value date">${date}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="status-badge"><i class="fas fa-hourglass-half"></i> Pending Review</span>
      </div>
    </div>

    <div class="payment-actions">
      <button class="approve-btn" onclick="approvePayment('${userId}')">
        <i class="fas fa-check"></i> Approve
      </button>
      <button class="reject-btn" onclick="rejectPayment('${userId}')">
        <i class="fas fa-times"></i> Reject
      </button>
    </div>
  `;

  return card;
}

window.approvePayment = async (userId) => {
  try {
    const userRef = doc(db, "users", userId);
    await updateDoc(userRef, {
      subscriptionActive: true,
      paymentPending: false,
      paymentStatus: 'approved',
      approvedDate: new Date()
    });

    showAlert('✓ Payment approved successfully!', 'success');
    setTimeout(() => loadPendingPayments(), 1000);
  } catch (error) {
    console.error('Error approving payment:', error);
    showAlert('Error approving payment', 'error');
  }
};

window.rejectPayment = async (userId) => {
  if (!confirm('Are you sure you want to reject this payment?')) return;

  try {
    const userRef = doc(db, "users", userId);
    await updateDoc(userRef, {
      paymentPending: false,
      paymentStatus: 'rejected',
      subscriptionActive: false,
      rejectedDate: new Date()
    });

    showAlert('✓ Payment rejected', 'success');
    setTimeout(() => loadPendingPayments(), 1000);
  } catch (error) {
    console.error('Error rejecting payment:', error);
    showAlert('Error rejecting payment', 'error');
  }
};

function showAlert(msg, type) {
  const box = document.getElementById('alert-box');
  const alert = document.createElement('div');
  alert.className = `alert ${type}`;
  alert.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'circle-exclamation'}"></i> ${msg}`;
  box.innerHTML = '';
  box.appendChild(alert);
  setTimeout(() => { alert.style.opacity = '0'; }, 3000);
}

window.logout = async () => {
  try {
    await signOut(auth);
    window.location.href = 'index.html';
  } catch (error) {
    console.error("Logout error:", error);
  }
};
</script>
</body>
</html>
