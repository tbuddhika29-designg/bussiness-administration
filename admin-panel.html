<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Panel | TB Index</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;--card2:#faf8ff;
  --text:#1e1b4b;--muted:#6d6a8a;
  --accent:#7c3aed;--accent2:#9333ea;--border:rgba(124,58,237,0.15);
  --border2:rgba(124,58,237,0.3);
  --shadow:0 4px 24px rgba(124,58,237,0.12);--green:#10b981;--red:#ef4444;
  --glass:rgba(255,255,255,0.7);
}
[data-theme="dark"]{
  --bg:#0d0b1e;--bg2:#110f2a;--card:#1a1730;--card2:#1f1c38;
  --text:#e9e4ff;--muted:#8b8aaa;--accent:#a78bfa;--accent2:#c084fc;
  --border:rgba(167,139,250,0.15);--border2:rgba(167,139,250,0.3);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --glass:rgba(26,23,48,0.8);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow)}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.header-logo{font-family:'Poppins',sans-serif;font-weight:800;color:var(--accent);font-size:1.1rem;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* HOME BUTTON — academic portal style */
.home-btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.78rem;font-weight:600;color:var(--accent);background:rgba(124,58,237,.08);border:1px solid var(--border2);padding:8px 14px;border-radius:100px;transition:all .3s;white-space:nowrap}
.home-btn:hover{background:var(--accent);color:#fff;transform:translateY(-1px);box-shadow:0 4px 14px rgba(124,58,237,.3)}
.home-btn i{font-size:.85rem}
@media(max-width:400px){.home-btn .btn-text{display:none}}

/* THEME BUTTON */
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--accent);cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0}
.theme-btn:hover{background:var(--accent);color:#fff;transform:scale(1.08)}

/* LOGOUT BUTTON — academic portal style */
.logout-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--red);border:1px solid rgba(239,68,68,.35);padding:8px 14px;border-radius:100px;font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .3s;white-space:nowrap}
.logout-btn:hover{background:var(--red);color:#fff;border-color:var(--red);transform:translateY(-1px);box-shadow:0 4px 14px rgba(239,68,68,.3)}
.logout-btn i{font-size:.82rem}
@media(max-width:500px){.logout-btn .btn-text{display:none}}

main{max-width:1200px;margin:0 auto;padding:40px 20px}
.admin-title{font-family:'Poppins',sans-serif;font-size:2rem;font-weight:800;color:var(--text);margin-bottom:28px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:40px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-family:'Poppins',sans-serif;font-size:2.2rem;font-weight:800;color:var(--accent);line-height:1}
.stat-label{font-size:.85rem;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
.section-title{font-family:'Poppins',sans-serif;font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:20px;display:flex;align-items:center;gap:12px}
.section-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center}
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{padding:8px 18px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:.85rem;font-weight:600;transition:all .3s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.users-table{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.table-wrapper{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:var(--card2);border-bottom:1px solid var(--border)}
th{padding:16px;text-align:left;font-weight:600;font-size:.85rem;color:var(--text);text-transform:uppercase;letter-spacing:.05em}
td{padding:16px;border-bottom:1px solid var(--border);font-size:.9rem}
tbody tr:hover{background:var(--card2)}
.user-email{color:var(--accent);font-weight:500}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;font-size:.75rem;font-weight:600}
.status-pending{background:rgba(245,158,11,.1);color:#f59e0b}
.status-approved{background:rgba(16,185,129,.1);color:var(--green)}
.action-btns{display:flex;gap:8px}
.btn-approve{padding:7px 14px;border-radius:8px;background:linear-gradient(135deg,var(--green),#059669);color:#fff;border:none;cursor:pointer;font-weight:600;font-size:.8rem;transition:all .3s}
.btn-approve:hover{opacity:.85;transform:translateY(-2px)}
.btn-reject{padding:7px 14px;border-radius:8px;background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.3);cursor:pointer;font-weight:600;font-size:.8rem;transition:all .3s}
.btn-reject:hover{background:var(--red);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.active{opacity:1;pointer-events:auto}
.modal-content{background:var(--card);border-radius:20px;padding:32px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-title{font-family:'Poppins',sans-serif;font-size:1.4rem;font-weight:700;color:var(--text);margin-bottom:12px}
.modal-desc{color:var(--muted);margin-bottom:24px;line-height:1.6}
.modal-actions{display:flex;gap:12px;justify-content:flex-end}
.btn-cancel{padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-weight:600;transition:all .3s}
.btn-cancel:hover{background:var(--card2)}
.btn-confirm{padding:10px 20px;border-radius:10px;background:var(--red);color:#fff;border:none;cursor:pointer;font-weight:600;transition:all .3s}
.btn-confirm:hover{opacity:.85}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="index.html" class="home-btn">
      <i class="fas fa-home"></i>
      <span class="btn-text">Home</span>
    </a>
    <div class="header-logo"><i class="fas fa-shield-halved"></i> Admin Panel</div>
  </div>
  <div class="header-right">
    <button class="theme-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
    <button class="logout-btn" onclick="adminLogout()">
      <i class="fas fa-sign-out-alt"></i>
      <span class="btn-text">Logout</span>
    </button>
  </div>
</header>

<main>
  <h1 class="admin-title">ඉහළ නිලධාරී පැනල්</h1>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-num" id="total-users">0</div>
      <div class="stat-label">Registered Users</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="pending-count">0</div>
      <div class="stat-label">Pending Approval</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="approved-count">0</div>
      <div class="stat-label">Approved</div>
    </div>
  </div>

  <div>
    <div class="section-title">
      <div class="section-icon"><i class="fas fa-users"></i></div>
      User Approvals
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterUsers('all')">All Users</button>
      <button class="filter-btn" onclick="filterUsers('pending')">Pending</button>
      <button class="filter-btn" onclick="filterUsers('approved')">Approved</button>
    </div>
    <div class="users-table">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Date Joined</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">
            <tr><td colspan="5" style="text-align:center;padding:40px">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="modal" id="confirmModal">
  <div class="modal-content">
    <div class="modal-title">Confirm Action</div>
    <div class="modal-desc" id="modalMessage">Are you sure?</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" id="confirmBtn" onclick="confirmAction()">Confirm</button>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
import { collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const ADMIN_UID = "VQO3ENwqo5O4XYakBi2bGC4R8uB3";

let currentFilter = 'all';
let allUsers = [];
let currentAction = null;
let currentUserUid = null;

window.adminLogout = async () => {
  await signOut(auth);
  window.location.href = 'login.html';
};

window.filterUsers = (filter) => {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  displayUsers();
};

function displayUsers() {
  const tbody = document.getElementById('users-tbody');
  let filtered = allUsers;
  if (currentFilter === 'pending') filtered = allUsers.filter(u => !u.approved);
  else if (currentFilter === 'approved') filtered = allUsers.filter(u => u.approved);

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted)">No users found</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(user => `
    <tr>
      <td style="font-weight:600">${user.displayName || 'Unknown'}</td>
      <td class="user-email">${user.email}</td>
      <td>${new Date(user.createdAt).toLocaleDateString()}</td>
      <td>
        <span class="status-badge ${user.approved ? 'status-approved' : 'status-pending'}">
          <i class="fas fa-${user.approved ? 'check-circle' : 'hourglass-half'}"></i>
          ${user.approved ? 'Approved' : 'Pending'}
        </span>
      </td>
      <td>
        <div class="action-btns">
          ${!user.approved ? `<button class="btn-approve" onclick="approveUser('${user.uid}','${user.displayName}')"><i class="fas fa-check"></i> Approve</button>` : ''}
          <button class="btn-reject" onclick="rejectUser('${user.uid}','${user.displayName}')">
            <i class="fas fa-times"></i> ${user.approved ? 'Revoke' : 'Reject'}
          </button>
        </div>
      </td>
    </tr>
  `).join('');

  document.getElementById('total-users').textContent = allUsers.length;
  document.getElementById('pending-count').textContent = allUsers.filter(u => !u.approved).length;
  document.getElementById('approved-count').textContent = allUsers.filter(u => u.approved).length;
}

window.approveUser = (uid, name) => {
  currentUserUid = uid; currentAction = 'approve';
  document.getElementById('modalMessage').textContent = `${name} සිට අනුමැතිය ලබා දෙන්න?`;
  document.getElementById('confirmModal').classList.add('active');
};

window.rejectUser = (uid, name) => {
  currentUserUid = uid; currentAction = 'reject';
  document.getElementById('modalMessage').textContent = `${name} සිට අනුමැතිය ඉවතට දෙන්න?`;
  document.getElementById('confirmModal').classList.add('active');
};

window.confirmAction = async () => {
  if (!currentUserUid) return;
  try {
    const userRef = doc(db, "users", currentUserUid);
    if (currentAction === 'approve') await updateDoc(userRef, { approved: true, approvalDate: new Date() });
    else await updateDoc(userRef, { approved: false });
    closeModal();
  } catch (error) { alert('Error: ' + error.message); }
};

window.closeModal = () => document.getElementById('confirmModal').classList.remove('active');

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  if (user.uid !== ADMIN_UID) { alert('Admin access only'); window.location.href = 'dashboard.html'; return; }
  const usersRef = collection(db, "users");
  onSnapshot(usersRef, (snapshot) => {
    allUsers = [];
    snapshot.forEach((doc) => allUsers.push({ uid: doc.id, ...doc.data() }));
    displayUsers();
  });
});

const saved = localStorage.getItem('ict-theme') || 'light';
if (saved === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('themeBtn').innerHTML = '<i class="fas fa-sun"></i>';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const d = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
  document.getElementById('themeBtn').innerHTML = d ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
  localStorage.setItem('ict-theme', d ? 'light' : 'dark');
});
</script>
</body>
</html>
