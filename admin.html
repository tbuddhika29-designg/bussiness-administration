<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Control Panel | TB Index</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;
  --text:#1e1b4b;--muted:#6d6a8a;
  --accent:#7c3aed;--accent2:#9333ea;
  --border:rgba(124,58,237,0.15);--border2:rgba(124,58,237,0.3);
  --shadow:0 4px 24px rgba(124,58,237,0.12);
  --green:#10b981;--red:#ef4444;--glass:rgba(255,255,255,0.7);
}
[data-theme="dark"] {
  --bg:#0d0b1e;--bg2:#110f2a;--card:#1a1730;
  --text:#e9e4ff;--muted:#8b8aaa;
  --accent:#a78bfa;--accent2:#c084fc;
  --border:rgba(167,139,250,0.15);--border2:rgba(167,139,250,0.3);
  --shadow:0 4px 24px rgba(0,0,0,0.4);--glass:rgba(26,23,48,0.8);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:40px 20px;transition:background .3s}

.admin-container{max-width:1000px;margin:0 auto}
header{display:flex;justify-content:between;align-items:center;margin-bottom:40px;background:var(--glass);backdrop-filter:blur(20px);padding:20px;border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;justify-content:space-between}
.title-area h1{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.5rem;color:var(--accent)}
.title-area p{font-size:.85rem;color:var(--muted)}

.theme-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
.theme-btn:hover{background:var(--accent);color:#fff}

/* TABLE STYLING */
.table-wrapper{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.9rem}
th{background:rgba(124,58,237,0.08);padding:16px 20px;font-family:'Poppins',sans-serif;font-weight:600;color:var(--accent);font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:18px 20px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}

.user-uid{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);background:rgba(0,0,0,0.03);padding:2px 6px;border-radius:4px}
[data-theme="dark"] .user-uid{background:rgba(255,255,255,0.05)}

/* STATUS BADGES */
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;font-size:.75rem;font-weight:600}
.badge.approved{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.2)}
.badge.pending{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.2)}

/* ACTION BUTTONS */
.action-btn{padding:8px 16px;border-radius:10px;border:none;font-family:'Poppins',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-approve{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,0.25)}
.btn-approve:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(16,185,129,0.4)}
.btn-suspend{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.btn-suspend:hover{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(239,68,68,0.25)}

/* LOADER */
.loading-text{text-align:center;padding:40px;color:var(--muted);font-weight:500}
</style>
</head>
<body>

<div class="admin-container">
  <header>
    <div class="title-area">
      <h1>Admin Control Panel</h1>
      <p>Manage user access approvals and account states in real-time</p>
    </div>
    <button class="theme-btn" id="themeBtn"><i class="fas fa-moon"></i></button>
  </header>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>User / Email</th>
          <th>User UID</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="userTableBody">
        <tr>
          <td colspan="4" class="loading-text"><i class="fas fa-spinner fa-spin"></i> Loading users database...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
import { collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const tableBody = document.getElementById("userTableBody");

// Security Check: පරිශීලකයා ලොග් වී ඇත්දැයි බැලීම (Security අවශ්‍ය නම් මෙතනට Admin check එකක් දැමිය හැක)
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  }
});

// Real-time ලියාපදිංචි වී ඇති සියලුම පරිශීලකයන් ලබා ගැනීම
const usersCollectionRef = collection(db, "users");

onSnapshot(usersCollectionRef, (snapshot) => {
  tableBody.innerHTML = ""; // පරණ දත්ත ඉවත් කිරීම

  if (snapshot.empty) {
    tableBody.innerHTML = `<tr><td colspan="4" class="loading-text">No registered users found.</td></tr>`;
    return;
  }

  snapshot.forEach((userDoc) => {
    const data = userDoc.data();
    const uid = userDoc.id;
    const email = data.email || "No Email Provided";
    const isApproved = data.isApproved === true;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td><strong>${email}</strong></td>
      <td><span class="user-uid">${uid}</span></td>
      <td>
        ${isApproved ? 
          `<span class="badge approved"><i class="fas fa-check-circle"></i> Approved</span>` : 
          `<span class="badge pending"><i class="fas fa-clock"></i> Pending Approval</span>`
        }
      </td>
      <td>
        ${isApproved ? 
          `<button class="action-btn btn-suspend" data-uid="${uid}" data-status="false"><i class="fas fa-user-slash"></i> Suspend</button>` : 
          `<button class="action-btn btn-approve" data-uid="${uid}" data-status="true"><i class="fas fa-user-check"></i> Approve</button>`
        }
      </td>
    `;
    tableBody.appendChild(tr);
  });

  // සියලුම Buttons වලට Click Event එකක් එකතු කිරීම
  document.querySelectorAll(".action-btn").forEach(button => {
    button.addEventListener("click", async (e) => {
      const targetUid = button.getAttribute("data-uid");
      const targetStatus = button.getAttribute("data-status") === "true";
      
      await toggleUserApproval(targetUid, targetStatus);
    });
  });
});

// User Approval එක True/False කරන Function එක
async function toggleUserApproval(uid, status) {
  try {
    const userDocRef = doc(db, "users", uid);
    await updateDoc(userDocRef, {
      isApproved: status
    });
  } catch (error) {
    console.error("Error updating user status: ", error);
    alert("Error: Could not update user status. Check Firestore Rules!");
  }
}
</script>

<script>
// Dark/Light Theme Control
const savedTheme = localStorage.getItem('ict-theme') || 'light';
if (savedTheme === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('themeBtn').innerHTML = '<i class="fas fa-sun"></i>';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeBtn').innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
  localStorage.setItem('ict-theme', isDark ? 'light' : 'dark');
});
</script>

</body>
</html>
