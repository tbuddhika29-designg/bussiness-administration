<!DOCTYPE html>
<html>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif;">
    <div style="text-align:center;">
        <h1>අලුත්වැඩියාවක් සිදුවේ!</h1>
        <p>අපගේ වෙබ් අඩවිය මේ වන විට වැඩිදියුණු කරමින් පවතී. කරුණාකර පසුව නැවත උත්සාහ කරන්න.</p>
    </div>
    <script type="module">
    // 1. මෙන්න මේ පේළිය අනිවාර්යයෙන්ම එකතු කරන්න
    import { initializeGlobalSettings } from "./global-config.js";
    
    // 2. මේ පේළියෙන් එම සැකසුම් ක්‍රියාත්මක වේ
    initializeGlobalSettings();

    // ඔබේ පවතින අනෙකුත් JavaScript කෝඩ් මෙතනින් පහළට තිබිය හැක
</script>
</body>
</html>
