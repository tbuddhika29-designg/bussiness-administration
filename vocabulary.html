<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BBA Vocabulary | Tharindu Buddhika</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg-app: #f6f5ff;
    --bg-sidebar: #ffffff;
    --bg-card: #ffffff;
    --bg-card-hover: #f1eaff;
    --accent: #7c3aed;
    --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
    --accent-glow: rgba(124, 58, 237, 0.15);
    --border: rgba(124, 58, 237, 0.12);
    --text-main: #1e1145;
    --text-title: #1e1145;
    --text-muted: #6b5f8a;
  }

  body.dark-mode {
    --bg-app: #0f0b1a;
    --bg-sidebar: #13101f;
    --bg-card: #1a1628;
    --bg-card-hover: #24213a;
    --border: rgba(168, 85, 247, 0.18);
    --text-main: #e9d5ff;
    --text-title: #f3e8ff;
    --text-muted: #a78bfa;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-app);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
    transition: background-color 0.4s ease, color 0.4s ease;
  }

  body::before {
    content: '';
    position: fixed;
    top: -10%; left: -10%;
    width: 60vw; height: 60vh;
    background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    transition: background 0.4s ease;
  }

  .app-container {
    display: flex;
    width: 100vw;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* === SIDEBAR === */
  aside {
    width: 320px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 10;
    box-shadow: 10px 0 40px rgba(124, 58, 237, 0.03);
    overflow-y: auto;
    transition: all 0.3s ease;
  }

  .badge {
    font-family: 'Fira Code', monospace;
    font-size: 10px;
    color: var(--accent);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 30px;
    background: rgba(124, 58, 237, 0.06);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .sidebar-title {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text-title);
    margin-top: 10px;
  }

  .subject-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .subject-btn {
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    padding: 10px 14px;
    border-radius: 10px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }

  .subject-btn:hover {
    background: var(--bg-card-hover);
    color: var(--accent);
  }

  .subject-btn.active {
    background: var(--accent-gradient);
    color: white;
    font-weight: 700;
  }

  .back-btn {
    align-self: flex-start;
    background: var(--accent-gradient);
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.25s ease;
    box-shadow: 0 4px 15px var(--accent-glow);
    margin-top: auto;
  }

  .back-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(124, 58, 237, 0.25);
  }

  /* === MAIN CONTENT === */
  main {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    position: relative;
  }

  .theme-toggle-btn {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.3rem;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(124, 58, 237, 0.08);
    z-index: 99;
  }

  .theme-toggle-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    transform: scale(1.08);
  }

  .theme-toggle-btn.active {
    background: var(--accent-gradient);
    border-color: transparent;
    box-shadow: 0 8px 24px var(--accent-glow);
  }

  .content-header {
    margin-top: 20px;
    margin-bottom: 35px;
  }

  .content-header h1 {
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--text-title);
    margin-bottom: 8px;
    transition: color 0.3s ease;
  }

  .content-header p {
    font-size: 13.5px;
    color: var(--text-muted);
    transition: color 0.3s ease;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  .vocab-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 24px rgba(124, 58, 237, 0.03);
    cursor: pointer;
  }

  .vocab-card:hover {
    transform: translateY(-4px);
    background: var(--bg-card-hover);
    border-color: var(--accent);
    box-shadow: 0 20px 38px rgba(124, 58, 237, 0.1);
  }

  .vocab-english {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
    transition: color 0.3s ease;
  }

  .vocab-sinhala {
    font-size: 15px;
    color: var(--text-title);
    font-weight: 600;
    margin-bottom: 12px;
    transition: color 0.3s ease;
  }

  .vocab-example {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    font-style: italic;
    border-left: 2px solid var(--accent);
    padding-left: 12px;
    transition: color 0.3s ease;
  }

  .search-box {
    margin-bottom: 30px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    max-width: 400px;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-card);
    color: var(--text-main);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
  }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state h2 {
    font-size: 1.5rem;
    margin-bottom: 10px;
    color: var(--text-title);
  }

  @media (max-width: 1024px) {
    .app-container { flex-direction: column; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 20px; }
    main { padding: 30px 20px; }
    .vocab-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  }

  @media (max-width: 640px) {
    main { padding: 20px; }
    .content-header h1 { font-size: 1.6rem; }
    .vocab-grid { grid-template-columns: 1fr; }
    aside { display: none; }
    .theme-toggle-btn { top: 20px; right: 20px; width: 40px; height: 40px; }
  }
</style>
</head>
<body>

<div class="app-container">

    <div class="badge">Vocabulary Module</div>
    <h2 class="sidebar-title">BBA Subjects</h2>
    <div class="subject-list" id="subject-list"></div>
    <a href="index.html" class="back-btn">← Back to Hub</a>

    </div>

    <div class="vocab-grid" id="vocab-grid"></div>
  </main>
</div>

    document.body.classList.add('dark-mode');
    themeToggleBtn.textContent = '☀️';
    themeToggleBtn.classList.add('active');

    document.body.classList.toggle('dark-mode');
    const isDarkMode = document.body.classList.contains('dark-mode');

  let currentSubject = 'Management Fundamentals';
  let allWords = [];

  /* === BUILD SIDEBAR === */
  function buildSidebar() {
    const list = document.getElementById('subject-list');
    Object.keys(vocabularyData).forEach(subject => {
      const btn = document.createElement('button');
      btn.className = 'subject-btn' + (subject === currentSubject ? ' active' : '');
      btn.textContent = subject;
      btn.onclick = () => selectSubject(subject);
      list.appendChild(btn);
    });
  }

  /* === SELECT SUBJECT === */
  function selectSubject(subject) {
    currentSubject = subject;
    document.querySelectorAll('.subject-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    document.getElementById('subject-title').textContent = subject;
    document.getElementById('subject-desc').textContent = `Subject Code: ${vocabularyData[subject].code}`;
    
    allWords = vocabularyData[subject].words;
    displayWords(allWords);
  }

  /* === DISPLAY WORDS === */
  function displayWords(words) {
    const grid = document.getElementById('vocab-grid');
    grid.innerHTML = '';
    
    if (words.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1"><h2>No words found</h2><p>Try a different search</p></div>';
      return;
    }

    words.forEach(word => {
      const card = document.createElement('div');
      card.className = 'vocab-card';
      card.innerHTML = `
        <div class="vocab-english">${word.en}</div>
        <div class="vocab-sinhala">${word.si}</div>
        <div class="vocab-example">"${word.ex}"</div>
      `;
      grid.appendChild(card);
    });
  }

  /* === SEARCH === */
  document.getElementById('search-input').addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase();
    const filtered = allWords.filter(word => 
      word.en.toLowerCase().includes(query) || 
      word.si.toLowerCase().includes(query)
    );
    displayWords(filtered);
  });

  /* === INITIALIZE === */
  buildSidebar();
  displayWords(allWords || vocabularyData[currentSubject].words);
</script>
  <script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

// පිටුව Load වීමට පෙර පරිශීලකයා සුදුසුකම් ලබා ඇත්දැයි බැලීම
onAuthStateChanged(auth, async (user) => {
  if (!user) { 
    window.location.href = 'login.html'; 
    return; 
  }
  
  const userSnap = await getDoc(doc(db, "users", user.uid));
  if (userSnap.exists()) {
    const data = userSnap.data();
    
    // 1. Admin විසින් Approve කර නැත්නම්
    if (!data.approved) {
      window.location.href = 'pending-approval.html';
      return;
    }
    // 2. සල්ලි ගෙවා සක්‍රීය මට්ටමක (Active Subscription) නැත්නම්
    if (!data.subscriptionActive) {
      window.location.href = 'subscription.html';
      return;
    }
    
    // සියල්ල හරි නම් පමණක් වොකැබියුලරි ලිස්ට් එක පෙන්වන්න (Load Data)
    initVocabularyApp(); 
  } else {
    window.location.href = 'login.html';
  }
});
