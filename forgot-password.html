<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Forgot Password | MY Index</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;
  --text:#1e1b4b;--muted:#6d6a8a;
  --accent:#7c3aed;--accent2:#9333ea;
  --border:rgba(124,58,237,0.15);
  --shadow:0 4px 24px rgba(124,58,237,0.12);
}
[data-theme="dark"] {
  --bg:#0d0b1e;--bg2:#161233;--card:#1a1730;
  --text:#e9e4ff;--muted:#8b8aaa;--border:rgba(124,58,237,0.25);
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; transition: background 0.3s, color 0.3s; }
body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; position: relative; }

/* Bubbles Background */
#bubbles { position: absolute; width:100%; height:100%; top:0; left:0; z-index:1; pointer-events: none; }
.bubble { position: absolute; background: rgba(124,58,237,0.1); border-radius: 50%; animation: floatUp 12s infinite linear; bottom: -100px; }
@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
}

.container { position: relative; z-index: 2; width: 100%; max-width: 420px; padding: 20px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 35px; box-shadow: var(--shadow); text-align: center; }
h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
p.desc { font-size: 13px; color: var(--muted); font-family: 'Inter', sans-serif; margin-bottom: 25px; line-height: 1.5; }

.input-group { position: relative; margin-bottom: 20px; text-align: left; }
.input-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text); opacity: 0.8; }
.input-wrapper { position: relative; }
.input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
.input-group input { width: 100%; padding: 14px 16px 14px 48px; background: var(--bg2); border: 1px solid transparent; border-radius: 12px; color: var(--text); font-size: 14px; font-family: 'Inter', sans-serif; outline: none; }
.input-group input:focus { border-color: var(--accent); background: var(--card); }

.btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 12px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(124,58,237,0.25); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn i.loading-icon { display: none; animation: spin 1s infinite linear; }
@keyframes spin { 100% { transform: rotate(360deg); } }
.btn.loading i.loading-icon { display: inline-block; }
.btn.loading span { display: none; }

.back-link { margin-top: 25px; font-size: 13px; }
.back-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
.back-link a:hover { text-decoration: underline; }

/* Alert Box */
.alert { display: none; padding: 12px; border-radius: 10px; font-size: 13px; font-family: 'Inter', sans-serif; margin-bottom: 20px; text-align: left; line-height: 1.4; }
.alert.error { display: flex; background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
.alert.success { display: flex; background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.2); }

/* Theme Button */
#themeBtn { position: fixed; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 10; }
</style>
</head>
<body>

<div id="bubbles"></div>
<button id="themeBtn"><i class="fas fa-moon"></i></button>

<div class="container">
  <div class="card">
    <h2>Reset Password</h2>
    <p class="desc">Enter your registered email address and we'll send you a link to reset your password.</p>

    <div id="alert-box" class="alert">
      <div id="alert-text"></div>
    </div>

    <div class="input-group">
      <label>Email Address</label>
      <div class="input-wrapper">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="name@example.com" required/>
      </div>
    </div>

    <button id="resetBtn" onclick="resetPassword()" class="btn">
      <i class="fas fa-spinner loading-icon"></i>
      <span><i class="fas fa-paper-plane"></i> Send Reset Link</span>
    </button>

    <div class="back-link">
      <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>
</div>

<script type="module">
import { auth } from "./firebase-config.js";
import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alert-box');
  const txt = document.getElementById('alert-text');
  box.className = `alert ${type}`;
  txt.textContent = msg;
}

function setLoading(on) {
  const btn = document.getElementById('resetBtn');
  btn.classList.toggle('loading', on);
  btn.disabled = on;
}

window.resetPassword = async () => {
  const email = document.getElementById('email').value.trim();

  if (!email) {
    showAlert('Please enter your email address.');
    return;
  }

  setLoading(true);
  showAlert('', 'hide'); // Reset alert

  try {
    // Firebase මඟින් Password Reset Email එකක් යැවීම
    await sendPasswordResetEmail(auth, email);
    
    showAlert('Password reset link sent! Please check your email inbox (and spam folder).', 'success');
    document.getElementById('email').value = ''; // Clear input
  } catch (error) {
    let errorMsg = 'Error sending reset email. Please try again.';
    if (error.code === 'auth/user-not-found') {
      errorMsg = 'No account found with this email address.';
    } else if (error.code === 'auth/invalid-email') {
      errorMsg = 'Please enter a valid email address.';
    }
    showAlert(errorMsg, 'error');
  } finally {
    setLoading(false);
  }
};
</script>

<script>
// UI Theme (Dark/Light Mode) Selection Logic
const saved = localStorage.getItem('ict-theme') || 'light';
if (saved === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('themeBtn').innerHTML = '<i class=\"fas fa-sun\"></i>';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const d = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
  document.getElementById('themeBtn').innerHTML = d ? '<i class=\"fas fa-moon\"></i>' : '<i class=\"fas fa-sun\"></i>';
  localStorage.setItem('ict-theme', d ? 'light' : 'dark');
});

// Create background bubbles
function createBubbles() {
  const w = document.getElementById('bubbles');
  for (let i = 0; i < 10; i++) {
    const b = document.createElement('div'); b.className = 'bubble';
    const sz = Math.random() * 60 + 30;
    b.style.width = sz + 'px'; b.style.height = sz + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.animationDelay = Math.random() * 8 + 's';
    w.appendChild(b);
  }
}
createBubbles();
</script>
  <script type="module">
    // 1. මෙන්න මේ පේළිය අනිවාර්යයෙන්ම එකතු කරන්න
    import { initializeGlobalSettings } from "./global-config.js";
    
    // 2. මේ පේළියෙන් එම සැකසුම් ක්‍රියාත්මක වේ
    initializeGlobalSettings();

    // ඔබේ පවතින අනෙකුත් JavaScript කෝඩ් මෙතනින් පහළට තිබිය හැක
</script>
</body>
</html>
