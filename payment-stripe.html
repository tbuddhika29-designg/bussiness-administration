<!DOCTYPE html>
<html>
<head>
  <title>Card Payment | BBA Portal</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body { font-family: sans-serif; background: #0f0f23; color: #e0e0e0;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1e1e3f; border-radius: 16px; padding: 36px; width: 380px; text-align: center; }
    h2 { color: #a78bfa; margin-bottom: 24px; }
    #card-element {
      background: #2a2a50; border: 1px solid #444; border-radius: 8px;
      padding: 14px; margin-bottom: 16px;
    }
    .pay-btn {
      width: 100%; padding: 14px; background: #635bff; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
    }
    #payment-message { color: #f87171; margin-top: 12px; }
  </style>
</head>
<body>
<div class="card">
  <h2>Card Payment</h2>
  <p id="amount-display" style="color:#4ade80; font-size:1.3rem; font-weight:700; margin-bottom:20px;"></p>
  <div id="card-element"></div>
  <button class="pay-btn" onclick="submitPayment()">Pay Now</button>
  <div id="payment-message"></div>
</div>

<script>
  // URL params read
  const params = new URLSearchParams(window.location.search);
  const amount = params.get('amount') || 0;
  document.getElementById('amount-display').textContent = 'LKR ' + parseInt(amount).toLocaleString();

  // ⚡ Simplest option: Stripe Payment Link use කරන්න
  // Stripe Dashboard → Payment Links → Create
  // Direct redirect
  const STRIPE_PAYMENT_LINK = "https://buy.stripe.com/YOUR_PAYMENT_LINK";

  function submitPayment() {
    // Payment Link redirect (no backend needed!)
    window.location.href = STRIPE_PAYMENT_LINK + "?prefilled_email=student@email.com";
  }
</script>
</body>
</html>
