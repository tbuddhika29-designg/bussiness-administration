<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Subscription Plans | MY Index</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root { --bg:#f3f0ff; --accent:#7c3aed; --text:#1e1b4b; --card:#ffffff; --border:rgba(124,58,237,0.15); }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
.wrapper { max-width: 600px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 20px; }
.payment-method { border: 1px solid var(--border); padding: 15px; border-radius: 10px; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.payment-method.selected { border-color: var(--accent); background: #f5f3ff; }
.save-btn { width: 100%; padding: 15px; background: var(--accent); color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; margin-top: 20px; }
#qr-form { display:none; margin: 20px 0; padding: 15px; background: #f8f7ff; border-radius: 10px; border: 1px dashed var(--accent); }
</style>
</head>
<body>

<div class="wrapper">
  <h2>Select Subscription Plan</h2>
  <div id="plans-container"></div>

  <h3>Payment Method</h3>
  <div class="payment-methods">
    <div class="payment-method" onclick="selectPaymentMethod('bank', this)">Bank Transfer</div>
    <div class="payment-method" id="qr-method-btn" onclick="selectPaymentMethod('qr', this)" style="display:none">PayHere / QR Payment</div>
  </div>

  <div id="qr-form">
    <p id="qr-details-text"></p>
  </div>

  <button class="save-btn" onclick="processPayment()">Confirm Payment</button>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

let selectedPlan = null;
let selectedPaymentMethod = null;
let isAutoApprove = false;
let PLANS = [];

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  
  const settingsSnap = await getDoc(doc(db, "settings", "config"));
  if (settingsSnap.exists()) {
    const data = settingsSnap.data();
    
    // Maintenance Check
    if (data.general?.maintenanceMode) {
      alert("System is under maintenance. Please try again later.");
      window.location.href = 'login.html';
      return;
    }

    isAutoApprove = data.general?.autoApprove || false;
    PLANS = data.plans || [];
    renderPlans(PLANS);

    // QR Settings
    if (data.payment?.qrEnabled) {
      document.getElementById('qr-method-btn').style.display = 'flex';
      document.getElementById('qr-details-text').innerHTML = `
        <strong>PayHere / QR Payment:</strong><br/>
        <a href="${data.payment.qrLink}" target="_blank">Click here to pay</a><br/>
        Contact: ${data.payment.qrContact}
      `;
    }
  }
});

function renderPlans(plans) {
  const container = document.getElementById('plans-container');
  container.innerHTML = plans.map(p => `
    <div class="payment-method" onclick="selectedPlan='${p.id}'">
      ${p.name} - Rs.${p.price} (${p.period})
    </div>
  `).join('');
}

window.selectPaymentMethod = (method, element) => {
  selectedPaymentMethod = method;
  document.querySelectorAll('.payment-method').forEach(el => el.classList.remove('selected'));
  element.classList.add('selected');
  document.getElementById('qr-form').style.display = method === 'qr' ? 'block' : 'none';
};

window.processPayment = async () => {
  if (!selectedPlan || !selectedPaymentMethod) { alert("Select plan and method!"); return; }
  
  const user = auth.currentUser;
  const userRef = doc(db, "users", user.uid);
  
  try {
    await updateDoc(userRef, {
      subscriptionActive: isAutoApprove,
      paymentStatus: isAutoApprove ? 'approved' : 'pending',
      subscriptionPlan: selectedPlan,
      paymentMethod: selectedPaymentMethod,
      updatedAt: serverTimestamp()
    });
    
    alert(isAutoApprove ? "Subscription Active!" : "Payment submitted for review.");
    window.location.href = 'student-profile.html';
  } catch(e) { console.error(e); }
};
</script>
</body>
</html>
