<script type="module">
import { auth, db } from "./firebase-config.js";
import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alert-box');
  const txt = document.getElementById('alert-text');
  box.className = `alert ${type}`;
  txt.textContent = msg;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function setLoading(on) {
  const btn = document.getElementById('regBtn');
  btn.classList.toggle('loading', on);
  btn.disabled = on;
}

window.register = async () => {
  const fullname  = document.getElementById('fullname').value.trim();
  const studentId = document.getElementById('studentId').value.trim();
  const programme = document.getElementById('programme').value.trim();
  const email     = document.getElementById('email').value.trim();
  const password  = document.getElementById('password').value;
  const confirm   = document.getElementById('confirmPassword').value;
  const agreed    = document.getElementById('termsWrap').classList.contains('checked');

  if (!fullname)           { showAlert('කරුණාකර ඔබගේ සම්පූර්ණ නම ඇතුළත් කරන්න.'); return; }
  if (!studentId)          { showAlert('කරුණාකර ඔබගේ ශිෂ්‍ය අංකය (Student ID) ඇතුළත් කරන්න.'); return; }
  if (!programme)          { showAlert('කරුණාකර ඔබගේ පාඨමාලාව (Programme) ඇතුළත් කරන්න.'); return; }
  if (!email)              { showAlert('කරුණාකර ඔබගේ Email ලිපිනය ඇතුළත් කරන්න.'); return; }
  if (password.length < 8) { showAlert('මුරපදය (Password) අවම වශයෙන් අක්ෂර 8කින් සමන්විත විය යුතුය.'); return; }
  if (password !== confirm){ showAlert('ඔබ ඇතුළත් කළ මුරපදයන් (Passwords) එකිනෙකට නොගැලපේ.'); return; }
  if (!agreed)             { showAlert('ඉදිරියට යාම සඳහා කරුණාකර සේවා කොන්දේසි (Terms of Service) වලට එකඟ වන්න.'); return; }

  setLoading(true);
  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    await updateProfile(user, { displayName: fullname });

    // Firestore හි user document එක create කිරීම
    await setDoc(doc(db, "users", user.uid), {
      uid: user.uid,
      displayName: fullname,
      email: email,
      studentId: studentId,
      programme: programme,
      approved: false,  // Admin අනුමැතිය සඳහා රැඳී සිටීම
      createdAt: new Date(),
      approvalDate: null,
      lastLogin: new Date()
    });

    showAlert('ගිණුම සාර්ථකව නිර්මාණය කරන ලදී! Admin අනුමැතිය ලැබෙන තෙක් රැඳී සිටින්න.', 'success');
    setTimeout(() => { window.location.href = 'pending-approval.html'; }, 1200);
  } catch (error) {
    const msgs = {
      'auth/email-already-in-use': 'මෙම Email ලිපිනය භාවිතා කර දැනටමත් ගිණුමක් ලියාපදිංචි කර ඇත.',
      'auth/invalid-email': 'කරුණාකර නිවැරදි Email ලිපිනයක් ඇතුළත් කරන්න.',
      'auth/weak-password': 'කරුණාකර වඩාත් ශක්තිමත් මුරපදයක් (Password) ලබා දෙන්න.',
    };
    showAlert(msgs[error.code] || error.message);
  } finally {
    setLoading(false);
  }
};
</script>
