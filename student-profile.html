<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Student Profile | MY Index</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;
  --text:#1e1b4b;--muted:#6d6a8a;
  --accent:#7c3aed;--accent2:#9333ea;--accent3:#a855f7;
  --border:rgba(124,58,237,0.15);--border2:rgba(124,58,237,0.3);
  --shadow:0 4px 24px rgba(124,58,237,0.12);
  --shadow2:0 8px 40px rgba(124,58,237,0.22);
  --green:#10b981;
  --glass:rgba(255,255,255,0.7);
}
[data-theme="dark"]{
  --bg:#0d0b1e;--bg2:#110f2a;--card:#1a1730;
  --text:#e9e4ff;--muted:#8b8aaa;
  --accent:#a78bfa;--accent2:#c084fc;--accent3:#d8b4fe;
  --border:rgba(167,139,250,0.15);--border2:rgba(167,139,250,0.3);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow2:0 8px 40px rgba(124,58,237,0.25);
  --glass:rgba(26,23,48,0.85);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;transition:background .3s,color .3s;position:relative}

/* BUBBLES */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;border-radius:50%;opacity:.12;animation:floatBubble linear infinite}
[data-theme="dark"] .bubble{opacity:.07}
@keyframes floatBubble{0%{transform:translateY(110vh) scale(0)}50%{opacity:.15}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* THEME BTN */
.theme-btn{position:fixed;top:20px;right:20px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--accent);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:var(--shadow)}
.theme-btn:hover{background:var(--accent);color:#fff;transform:scale(1.1)}

/* CONTAINER */
.profile-wrapper{position:relative;z-index:10;width:100%;max-width:600px;padding:20px;animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* BRAND */
.brand-top{text-align:center;margin-bottom:32px}
.brand-logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.6rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block;margin-bottom:6px}
.brand-sub{font-size:.78rem;color:var(--muted);letter-spacing:.05em}

/* MAIN CARD */
.profile-card{background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:24px;padding:40px 32px;box-shadow:var(--shadow2);position:relative;overflow:hidden}
.profile-card::before{content:'';position:absolute;top:-60px;right:-60px;width:160px;height:160px;background:radial-gradient(circle,rgba(124,58,237,.2),transparent 70%);border-radius:50%;pointer-events:none}

/* AVATAR SECTION */
.profile-avatar{text-align:center;margin-bottom:28px}
.avatar-ring{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(124,58,237,.3);font-size:2.4rem;color:#fff}

/* INFO GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.info-item{background:rgba(124,58,237,.04);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.info-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.info-value{font-family:'Poppins',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text)}

/* STATUS CARD */
.status-card{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(168,85,247,.06));border:1px solid var(--border2);border-radius:16px;padding:18px;margin-bottom:28px;display:flex;align-items:center;gap:12px}
.status-icon{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;flex-shrink:0}
.status-text{flex:1}
.status-label{font-size:.8rem;color:var(--muted);margin-bottom:2px}
.status-value{font-family:'Poppins',sans-serif;font-size:.95rem;font-weight:600;color:var(--text)}

/* DIVIDER */
.divider{height:1px;background:var(--border2);margin:28px 0}

/* ACTION BUTTON */
.action-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Poppins',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(124,58,237,.35);display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.02em}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.45)}
.action-btn:active{transform:translateY(0)}
.action-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* SECONDARY BTN */
.secondary-btn{width:100%;padding:14px;border-radius:12px;border:1px solid var(--border2);background:transparent;color:var(--accent);font-family:'Poppins',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
.secondary-btn:hover{background:var(--accent);color:#fff}

/* ALERT */
.alert{padding:12px 16px;border-radius:10px;font-size:.84rem;font-weight:500;display:none;align-items:center;gap:10px;animation:fadeUp .3s ease;margin-bottom:16px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:var(--green)}
.alert.show{display:flex}
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>
<button class="theme-btn" id="themeBtn" title="Toggle Theme"><i class="fas fa-moon"></i></button>

<div class="profile-wrapper">
  <div class="brand-top">
    <span class="brand-logo">MY Index</span>
    <div class="brand-sub">Student Portal</div>
  </div>

  <div class="profile-card">
    <div class="profile-avatar">
      <div class="avatar-ring"><i class="fas fa-user-graduate"></i></div>
      <h2 style="font-family:'Poppins',sans-serif;font-size:1.3rem;margin-bottom:4px" id="student-name">Loading...</h2>
      <p style="color:var(--muted);font-size:.85rem" id="student-email">-</p>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Batch</div>
        <div class="info-value">IFLS26</div>
      </div>
      <div class="info-item">
        <div class="info-label">Program</div>
        <div class="info-value">BBA</div>
      </div>
      <div class="info-item">
        <div class="info-label">Year</div>
        <div class="info-value">2026</div>
      </div>
      <div class="info-item">
        <div class="info-label">Status</div>
        <div class="info-value" id="student-status">Active</div>
      </div>
    </div>

    <div class="status-card">
      <div class="status-icon"><i class="fas fa-clock"></i></div>
      <div class="status-text">
        <div class="status-label">Subscription Status</div>
        <div class="status-value" id="subscription-status">Not Subscribed</div>
      </div>
    </div>

    <div class="alert" id="alert-box">
      <i class="fas fa-check-circle"></i>
      <span id="alert-text">Account verified!</span>
    </div>

    <div class="divider"></div>

    <button class="action-btn" id="proceed-btn" onclick="proceedToSubscription()">
      <i class="fas fa-arrow-right"></i> Continue to Subscription
    </button>

    <button class="secondary-btn" id="logout-btn" onclick="logout()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    if (!userSnap.exists()) {
      window.location.href = 'login.html';
      return;
    }

    const userData = userSnap.data();
    
    // පළමුවෙන් approved check කරන්න
    if (!userData.approved) {
      window.location.href = 'pending-approval.html';
      return;
    }

    // ස්ටුඩන්ට් විස්තර පෙන්නන්න
    document.getElementById('student-name').textContent = userData.displayName || 'Student';
    document.getElementById('student-email').textContent = user.email;
    
    // Subscription status check කරන්න
    if (userData.subscriptionActive) {
      document.getElementById('subscription-status').textContent = 'Active';
      document.getElementById('alert-box').classList.add('show');
      // 3 seconds පස්සෙ dashboard එකට යන්න
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 3000);
    }

  } catch (error) {
    console.error('Profile loading error:', error);
    window.location.href = 'login.html';
  }
});

window.proceedToSubscription = () => {
  window.location.href = 'subscription.html';
};

window.logout = async () => {
  try {
    await signOut(auth);
    window.location.href = 'index.html';
  } catch (error) {
    console.error("Logout error:", error);
    alert("Logout failed");
  }
};
</script>

<script>
// Theme
const saved = localStorage.getItem('ict-theme') || 'light';
if (saved === 'dark') { 
  document.documentElement.setAttribute('data-theme','dark'); 
  document.getElementById('themeBtn').innerHTML='<i class="fas fa-sun"></i>'; 
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const d = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
  document.getElementById('themeBtn').innerHTML = d ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
  localStorage.setItem('ict-theme', d ? 'light' : 'dark');
});

// Bubbles
function createBubbles() {
  const w = document.getElementById('bubbles');
  const cols = ['#7c3aed','#9333ea','#a855f7','#c084fc','#6d28d9'];
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const sz = Math.random() * 80 + 30;
    b.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-duration:${12+Math.random()*18}s;animation-delay:${Math.random()*10}s;`;
    w.appendChild(b);
  }
}
createBubbles();
</script>
</body>
</html>
