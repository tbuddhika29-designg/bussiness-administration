<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGBM1005 —English Language for Business 1</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#b19ffb; /* Radiant Purple Accent */
  --a06:rgba(147,112,219,0.06);--a08:rgba(147,112,219,0.08);--a14:rgba(147,112,219,0.14);--a15:rgba(147,112,219,0.15);
  --a22:rgba(147,112,219,0.22);--a28:rgba(147,112,219,0.28);--a30:rgba(147,112,219,0.3);--a35:rgba(147,112,219,0.35);
  --a45:rgba(147,112,219,0.45);--a50:rgba(147,112,219,0.5);
  --gold:#d8b4fe;--gold2:#8b5cf6; /* Purple Gradient Shades */
  --bg:#070512; /* Deep Dark Violet/Black Background */
  --white:rgba(255,255,255,0.95);--muted:rgba(230,225,255,0.6);--dim:rgba(230,225,255,0.3);
  --card-bg:linear-gradient(135deg,var(--a15) 0%,rgba(15,10,35,0.7) 100%);
  --hero-bg:linear-gradient(135deg,var(--a15) 0%,rgba(12,8,28,0.6) 100%);
}

/* Light Mode Colors (Soft Lavender Theme) */
[data-theme="light"] {
  --bg:#f3f0ff;
  --white:#120e2e;
  --muted:#5c5470;
  --dim:#9f9aa4;
  --accent:#6c5ce7;
  --a06:rgba(108,92,231,0.08);--a08:rgba(108,92,231,0.12);--a14:rgba(108,92,231,0.18);--a15:rgba(108,92,231,0.22);
  --a22:rgba(108,92,231,0.28);--a28:rgba(108,92,231,0.33);--a30:rgba(108,92,231,0.38);--a35:rgba(108,92,231,0.42);
  --card-bg:linear-gradient(135deg,rgba(255,255,255,0.95) 0%,rgba(243,239,255,0.9) 100%);
  --hero-bg:linear-gradient(135deg,rgba(255,255,255,0.9) 0%,rgba(235,228,255,0.85) 100%);
}

html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;overflow-x:hidden;transition:background 0.5s ease, color 0.5s ease;}
.bg-scene{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 50% -20%,var(--a28) 0%,transparent 70%),radial-gradient(ellipse 60% 50% at 100% 80%,var(--a14) 0%,transparent 60%),var(--bg);transition:background 0.5s ease;}
.blob{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;mix-blend-mode:screen;}
[data-theme="light"] .blob { mix-blend-mode: multiply; opacity: 0.2; }
.blob-1{width:550px;height:550px;background:radial-gradient(circle,var(--a30) 0%,transparent 65%);top:-160px;left:-100px;animation:b1 20s ease-in-out infinite;}
.blob-2{width:400px;height:400px;background:radial-gradient(circle,var(--a14) 0%,transparent 65%);bottom:-80px;right:-80px;animation:b2 25s ease-in-out infinite;}
.blob-3{width:300px;height:300px;background:radial-gradient(circle,var(--a14) 0%,transparent 65%);top:45%;left:60%;animation:b3 18s ease-in-out infinite;}
@keyframes b1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,80px)}}
@keyframes b2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-60px)}}
@keyframes b3{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,50px)}}
.grid-overlay{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--a06) 1px,transparent 1px),linear-gradient(90deg,var(--a06) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
[data-theme="light"] .stars { display: none; }
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--dur,3s) ease-in-out infinite;animation-delay:var(--del,0s);}
@keyframes twinkle{0%,100%{opacity:0.1;transform:scale(1)}50%{opacity:0.6;transform:scale(1.5)}}
.page{position:relative;z-index:10;max-width:1100px;margin:0 auto;padding:50px 36px 80px;}

/* Header / Nav Layout */
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 44px; opacity:0; animation:fadeUp 0.6s ease forwards 0.05s; }
.top-nav { margin-bottom: 0; }
.back-link{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:0.82rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);background:var(--a08);border:1px solid var(--a22);padding:10px 20px;border-radius:100px;transition:all 0.3s ease;}
.back-link:hover{background:var(--a22);border-color:var(--a45);color:var(--white);transform:translateX(-3px);box-shadow:0 8px 30px var(--a30);}
.back-arrow{font-size:1rem;transition:transform 0.3s ease;}
.back-link:hover .back-arrow{transform:translateX(-4px);}

/* Theme Toggle Button */
.theme-toggle { background: var(--a08); border: 1px solid var(--a22); color: var(--accent); width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: all 0.3s ease; }
.theme-toggle:hover { background: var(--a22); border-color: var(--a45); transform: scale(1.05); box-shadow: 0 4px 15px var(--a30); }

.hero{padding:56px 50px 48px;border-radius:28px;background:var(--hero-bg);border:1px solid var(--a35);backdrop-filter:blur(24px);position:relative;overflow:hidden;margin-bottom:50px;text-align:center;box-shadow:0 0 80px var(--a22),inset 0 1px 0 rgba(255,255,255,0.07);opacity:0;animation:fadeUp 0.8s ease forwards 0.15s;transition: background 0.5s ease;}
.hero::before{content:'';position:absolute;inset:-1px;border-radius:28px;background:linear-gradient(135deg,var(--a45),transparent 50%,var(--a15));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1px;pointer-events:none;}
.hero-watermark{position:absolute;right:-10px;bottom:-20px;font-family:'Playfair Display',serif;font-size:8rem;font-weight:700;color:var(--a06);pointer-events:none;user-select:none;line-height:1;}
.hero-tag{display:inline-flex;align-items:center;gap:8px;background:var(--a15);border:1px solid var(--a35);border-radius:100px;padding:6px 18px;font-size:0.72rem;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
.tag-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotPulse 2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 var(--a50)}50%{box-shadow:0 0 0 6px transparent}}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,4vw,3.2rem);font-weight:700;line-height:1.15;color:var(--white);position:relative;z-index:1;margin-bottom:14px;text-shadow:0 2px 40px var(--a30);}
.hero-meta{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:26px;position:relative;z-index:1;}
.hero-chip{display:flex;align-items:center;gap:8px;background:var(--a08);border:1px solid var(--a22);border-radius:10px;padding:8px 16px;font-size:0.8rem;font-weight:500;color:var(--muted);}
.hero-chip strong{color:var(--accent);font-weight:700;}
.section-hd{display:flex;align-items:center;gap:18px;margin-bottom:28px;opacity:0;animation:fadeUp 0.8s ease forwards 0.35s;}
.section-hd-badge{padding:6px 16px;border-radius:100px;background:var(--a15);border:1px solid var(--a35);font-size:0.7rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);white-space:nowrap;}
.section-hd-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;font-style:italic;color:var(--white);}
.section-hd-line{flex:1;height:1px;background:linear-gradient(90deg,var(--a35),transparent);}
.section-hd-count{font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--dim);white-space:nowrap;}
.lectures-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px;opacity:0;animation:fadeUp 0.8s ease forwards 0.45s;}

/* Lecture Cards Styles & Click Animation */
.lec-card{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.4s ease, background 0.5s ease;opacity:0;animation:fadeUp 0.5s ease forwards;}

/* Dynamic Delays */
.lec-card:nth-child(1){animation-delay:0.50s}.lec-card:nth-child(2){animation-delay:0.52s}.lec-card:nth-child(3){animation-delay:0.54s}.lec-card:nth-child(4){animation-delay:0.56s}.lec-card:nth-child(5){animation-delay:0.58s}.lec-card:nth-child(6){animation-delay:0.60s}.lec-card:nth-child(7){animation-delay:0.62s}.lec-card:nth-child(8){animation-delay:0.64s}.lec-card:nth-child(9){animation-delay:0.66s}.lec-card:nth-child(10){animation-delay:0.68s}.lec-card:nth-child(11){animation-delay:0.70s}.lec-card:nth-child(12){animation-delay:0.72s}.lec-card:nth-child(13){animation-delay:0.74s}.lec-card:nth-child(14){animation-delay:0.76s}.lec-card:nth-child(15){animation-delay:0.78s}.lec-card:nth-child(16){animation-delay:0.80s}.lec-card:nth-child(17){animation-delay:0.82s}.lec-card:nth-child(18){animation-delay:0.84s}.lec-card:nth-child(19){animation-delay:0.86s}.lec-card:nth-child(20){animation-delay:0.88s}

.lec-card:hover{transform:translateY(-8px) scale(1.06);box-shadow:0 24px 60px var(--a45),0 0 40px var(--a22);}

/* Premium Click Interaction */
.lec-card:active {
  transform: translateY(-2px) scale(0.95) !important;
  box-shadow: 0 8px 20px var(--a30), 0 0 10px var(--a14) !important;
  transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1) !important;
}

.lec-bg{position:absolute;inset:0;background:var(--card-bg);border:1px solid var(--a22);border-radius:16px;backdrop-filter:blur(16px);transition:border-color 0.35s ease,background 0.35s ease;}
.lec-card:hover .lec-bg{border-color:var(--a50);background:linear-gradient(135deg,var(--a30) 0%,rgba(20,15,45,0.7) 100%);}
[data-theme="light"] .lec-card:hover .lec-bg{background:linear-gradient(135deg,rgba(255,255,255,1) 0%,rgba(235,225,255,1) 100%);}
.lec-card::before{content:'';position:absolute;top:-100%;left:-100%;width:70%;height:200%;background:linear-gradient(105deg,transparent,rgba(255,255,255,0.08),transparent);transform:skewX(-20deg);transition:top 0.55s ease,left 0.55s ease;z-index:2;pointer-events:none;}
.lec-card:hover::before{top:-10%;left:130%;}
.lec-num{position:relative;z-index:1;font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transition:transform 0.35s cubic-bezier(0.34,1.56,0.64,1);line-height:1;}
.lec-card:hover .lec-num{transform:scale(1.15);}
.lec-accent{position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform 0.4s ease;z-index:3;}
.lec-card:hover .lec-accent{transform:scaleX(1);}
.bottom-nav{margin-top:60px;text-align:center;opacity:0;animation:fadeUp 0.8s ease forwards 1s;}
.bottom-back{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font-size:0.9rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--white);background:var(--a15);border:1px solid var(--a35);padding:16px 36px;border-radius:14px;backdrop-filter:blur(16px);transition:all 0.35s ease;}
.bottom-back:hover{background:var(--a30);border-color:var(--a50);transform:translateY(-4px);box-shadow:0 20px 50px var(--a30);}
.bottom-back .arr{font-size:1.1rem;transition:transform 0.3s ease;}
.bottom-back:hover .arr{transform:translateX(-4px);}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){.page{padding:32px 16px 60px;}.hero{padding:36px 24px 32px;}.lectures-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;}.lec-num{font-size:1.5rem;}}
@media(max-width:480px){.lectures-grid{grid-template-columns:repeat(5,1fr);gap:8px;}.lec-num{font-size:1.3rem;}}
</style>
</head>
<body>
<div class="bg-scene"></div>
<div class="blob blob-1"></div>

<div class="page">

  <div class="hero">

  <div class="lectures-grid">

<script>
// Stars Background Generation
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<100;i++){
    const s=document.createElement('div');const sz=Math.random()*2+0.5;
    s.className='star';
    s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${2+Math.random()*4}s;--del:${Math.random()*5}s;opacity:${Math.random()*0.3+0.05};`;
    c.appendChild(s);
  }
})();

// Card 3D Tilt Effect on Hover
document.querySelectorAll('.lec-card').forEach(card=>{
  card.addEventListener('mousemove',e=>{
    const r=card.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width-0.5)*18;
    const y=((e.clientY-r.top)/r.height-0.5)*-18;
    card.style.transform=`translateY(-8px) scale(1.06) rotateX(${y}deg) rotateY(${x}deg)`;
  });
  card.addEventListener('mouseleave',()=>{card.style.transform='';});
});

// Persistent Light/Dark Mode Logic
const themeToggle = document.getElementById('themeToggle');
const currentTheme = localStorage.getItem('theme') || 'dark';

if (currentTheme === 'light') {
  document.documentElement.setAttribute('data-theme', 'light');
}

themeToggle.addEventListener('click', () => {
  let theme = 'dark';
  if (document.documentElement.getAttribute('data-theme') !== 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    theme = 'light';
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  localStorage.setItem('theme', theme);
});
</script>
