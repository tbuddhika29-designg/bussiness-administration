<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Navigation Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-purple: #7c3aed;
            --secondary-purple: #a855f7;
            --dark-purple: #5b21b6;
            --light-purple: #ede9fe;
            --accent-gold: #fbbf24;
            --dark-bg: #0f0b1f;
            --card-bg: #1a1529;
            --text-light: #f3f4f6;
            --text-muted: #d1d5db;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1f1636 50%, #2d1b4e 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            text-align: center;
            color: var(--accent-gold);
            margin-bottom: 50px;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.2);
        }

        /* Main Menu Container */
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            perspective: 1000px;
        }

        /* Menu Links */
        .menu a {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 25px;
            background: linear-gradient(135deg, var(--card-bg) 0%, rgba(168, 85, 247, 0.08) 100%);
            border: 2px solid rgba(168, 85, 247, 0.3);
            border-radius: 18px;
            text-decoration: none;
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            gap: 12px;
            cursor: pointer;
            min-height: 180px;
        }

        /* Background Glow Effect */
        .menu a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent 0%, rgba(168, 85, 247, 0.2) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
            z-index: 0;
        }

        /* Hover Glow */
        .menu a:hover::before {
            transform: translateX(100%);
        }

        /* Content Wrapper */
        .menu a span {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Emoji Icon */
        .menu a .emoji {
            font-size: 3.5rem;
            transition: all 0.4s ease;
            display: block;
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.3));
        }

        /* Text */
        .menu a .text {
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        /* Hover Effects */
        .menu a:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--secondary-purple);
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.25) 0%, rgba(124, 58, 237, 0.15) 100%);
            box-shadow: 
                0 20px 50px rgba(168, 85, 247, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .menu a:hover .emoji {
            transform: scale(1.15) rotate(5deg);
            filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.6));
        }

        .menu a:hover .text {
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        /* Individual Hover Colors */
        .menu a:nth-child(1):hover {
            border-color: #ec4899;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.15) 0%, rgba(236, 72, 153, 0.05) 100%);
            box-shadow: 0 20px 50px rgba(236, 72, 153, 0.3);
        }

        .menu a:nth-child(2):hover {
            border-color: #06b6d4;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0.05) 100%);
            box-shadow: 0 20px 50px rgba(6, 182, 212, 0.3);
        }

        .menu a:nth-child(3):hover {
            border-color: #f59e0b;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(245, 158, 11, 0.05) 100%);
            box-shadow: 0 20px 50px rgba(245, 158, 11, 0.3);
        }

        .menu a:nth-child(4):hover {
            border-color: #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(16, 185, 129, 0.05) 100%);
            box-shadow: 0 20px 50px rgba(16, 185, 129, 0.3);
        }

        .menu a:nth-child(5):hover {
            border-color: #8b5cf6;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(139, 92, 246, 0.05) 100%);
            box-shadow: 0 20px 50px rgba(139, 92, 246, 0.3);
        }

        /* Active State */
        .menu a:active {
            transform: translateY(-5px) scale(0.98);
        }

        /* Divider Line */
        .menu-divider {
            grid-column: 1 / -1;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(168, 85, 247, 0.5) 50%, transparent 100%);
            margin: 10px 0;
        }

        /* Footer Text */
        .menu-footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .menu-footer a {
            color: var(--secondary-purple);
            text-decoration: none;
            transition: color 0.3s;
        }

        .menu-footer a:hover {
            color: var(--accent-gold);
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-title {
                font-size: 1.8rem;
                margin-bottom: 30px;
            }

            .menu {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 15px;
            }

            .menu a {
                padding: 25px 15px;
                min-height: 150px;
            }

            .menu a .emoji {
                font-size: 2.5rem;
            }

            .menu a {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .menu {
                grid-template-columns: 1fr;
            }

            .menu a {
                padding: 30px 20px;
                flex-direction: row;
                justify-content: flex-start;
                gap: 20px;
            }

            .menu a .emoji {
                font-size: 2rem;
            }

            .menu a span {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* Loading Animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu a {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .menu a:nth-child(1) { animation-delay: 0.1s; }
        .menu a:nth-child(2) { animation-delay: 0.2s; }
        .menu a:nth-child(3) { animation-delay: 0.3s; }
        .menu a:nth-child(4) { animation-delay: 0.4s; }
        .menu a:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">Study Resources</h1>
        
        <div class="menu">
            <a href="notes.html">
                <span>
                    <span class="emoji">📖</span>
                    <span class="text">Notes</span>
                </span>
            </a>

            <a href="summary.html">
                <span>
                    <span class="emoji">📝</span>
                    <span class="text">Summary Notes</span>
                </span>
            </a>

            <a href="questions.html">
                <span>
                    <span class="emoji">❓</span>
                    <span class="text">Q & A</span>
                </span>
            </a>

            <a href="pastpapers.html">
                <span>
                    <span class="emoji">📄</span>
                    <span class="text">Past Papers</span>
                </span>
            </a>

            <a href="quiz.html">
                <span>
                    <span class="emoji">🎯</span>
                    <span class="text">Quiz</span>
                </span>
            </a>
        </div>

        <div class="menu-footer">
            <p>Select a resource to continue your learning journey</p>
        </div>
    </div>
</body>
</html>
