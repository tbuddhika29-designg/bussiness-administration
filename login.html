<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login | MY Index</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
  --bg:#f3f0ff;--bg2:#ede9fe;--card:#ffffff;
  --text:#1e1b4b;--muted:#6d6a8a;
  --accent:#7c3aed;--accent2:#9333ea;--accent3:#a855f7;
  --border:rgba(124,58,237,0.15);--border2:rgba(124,58,237,0.3);
  --shadow:0 4px 24px rgba(124,58,237,0.12);
  --shadow2:0 8px 40px rgba(124,58,237,0.22);
  --red:#ef4444;--green:#10b981;
  --glass:rgba(255,255,255,0.7);
}
[data-theme="dark"]{
  --bg:#0d0b1e;--bg2:#110f2a;--card:#1a1730;
  --text:#e9e4ff;--muted:#8b8aaa;
  --accent:#a78bfa;--accent2:#c084fc;--accent3:#d8b4fe;
  --border:rgba(167,139,250,0.15);--border2:rgba(167,139,250,0.3);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow2:0 8px 40px rgba(124,58,237,0.25);
  --glass:rgba(26,23,48,0.85);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;transition:background .3s,color .3s;position:relative}

/* BUBBLES */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;border-radius:50%;opacity:.12;animation:floatBubble linear infinite}
[data-theme="dark"] .bubble{opacity:.07}
@keyframes floatBubble{0%{transform:translateY(110vh) scale(0)}50%{opacity:.15}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* THEME BTN */
.theme-btn{position:fixed;top:20px;right:20px;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--border2);background:var(--card);color:var(--accent);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:var(--shadow)}
.theme-btn:hover{background:var(--accent);color:#fff;transform:scale(1.1)}

/* CARD WRAPPER */
.login-wrapper{position:relative;z-index:10;width:100%;max-width:440px;padding:20px;animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* BRAND TOP */
.brand-top{text-align:center;margin-bottom:28px}
.brand-logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.6rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block;margin-bottom:6px}
.brand-sub{font-size:.78rem;color:var(--muted);letter-spacing:.05em}

/* CARD */
.login-card{background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:24px;padding:36px 32px;box-shadow:var(--shadow2);position:relative;overflow:hidden}
.login-card::before{content:'';position:absolute;top:-60px;right:-60px;width:160px;height:160px;background:radial-gradient(circle,rgba(124,58,237,.2),transparent 70%);border-radius:50%;pointer-events:none}
.login-card::after{content:'';position:absolute;bottom:-40px;left:-40px;width:120px;height:120px;background:radial-gradient(circle,rgba(168,85,247,.15),transparent 70%);border-radius:50%;pointer-events:none}

/* HERO TAG */
.card-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(124,58,237,.1);border:1px solid var(--border2);border-radius:100px;padding:5px 14px;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.card-title{font-family:'Poppins',sans-serif;font-size:1.6rem;font-weight:800;color:var(--text);margin-bottom:4px;line-height:1.15}
.card-sub{font-size:.85rem;color:var(--muted);margin-bottom:28px;line-height:1.5}

/* FORM */
.form-group{margin-bottom:18px;position:relative}
.form-label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.04em}
.input-wrap{position:relative}
.input-wrap i.icon-left{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;transition:color .3s;pointer-events:none}
.form-input{width:100%;padding:13px 14px 13px 40px;border:1px solid var(--border2);border-radius:12px;background:var(--card);color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:border-color .3s,box-shadow .3s;-webkit-appearance:none}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.form-input:focus + .icon-left,.input-wrap:focus-within .icon-left{color:var(--accent)}
.form-input::placeholder{color:var(--muted);opacity:.7}

/* TOGGLE PASSWORD */
.toggle-pw{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:4px;transition:color .3s}
.toggle-pw:hover{color:var(--accent)}

/* HELPER ROW */
.helper-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.remember-wrap{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.custom-check{width:18px;height:18px;border:2px solid var(--border2);border-radius:5px;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0;background:var(--card)}
.remember-wrap.checked .custom-check{background:var(--accent);border-color:var(--accent)}
.remember-wrap.checked .custom-check::after{content:'✓';color:#fff;font-size:.65rem;font-weight:700}
.remember-label{font-size:.8rem;color:var(--muted)}
.forgot-link{font-size:.8rem;color:var(--accent);text-decoration:none;font-weight:600;transition:opacity .2s}
.forgot-link:hover{opacity:.7}

/* SUBMIT BTN */
.submit-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:'Poppins',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(124,58,237,.35);display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;letter-spacing:.02em}
.submit-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:background .3s}
.submit-btn:hover::before{background:rgba(255,255,255,.08)}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,.45)}
.submit-btn:active{transform:translateY(0)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top:2px solid #fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.submit-btn.loading .btn-text{display:none}
.submit-btn.loading .btn-spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:12px;margin:22px 0}
.divider-line{flex:1;height:1px;background:var(--border2)}
.divider-text{font-size:.75rem;color:var(--muted);white-space:nowrap}

/* ALERT */
.alert{padding:12px 16px;border-radius:10px;font-size:.84rem;font-weight:500;display:none;align-items:center;gap:10px;animation:fadeUp .3s ease;margin-bottom:16px}
.alert.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:var(--red);display:flex}
.alert.success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:var(--green);display:flex}

/* REGISTER LINK */
.register-row{text-align:center;margin-top:22px;font-size:.84rem;color:var(--muted)}
.register-row a{color:var(--accent);font-weight:600;text-decoration:none;transition:opacity .2s}
.register-row a:hover{opacity:.75}

/* STUDENT ID CHIP */
.id-chip{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding:8px 16px;background:rgba(124,58,237,.06);border:1px solid var(--border);border-radius:100px;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted)}
.id-chip span{color:var(--accent);font-weight:600}
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>
<button class="theme-btn" id="themeBtn" title="Toggle Theme"><i class="fas fa-moon"></i></button>

<div class="login-wrapper">

  <div class="brand-top">
    <span class="brand-logo">MY Index</span>
    <div class="brand-sub">Premium Student Workspace</div>
  </div>

  <div class="login-card">
    <div class="card-tag"><i class="fas fa-lock"></i>&nbsp; Secure Login</div>
    <div class="card-title">Welcome Back 👋</div>
    <div class="card-sub">Sign in to access your academic portal and study tools.</div>

    <!-- ALERT -->
    <div class="alert" id="alert-box">
      <i class="fas fa-circle-exclamation"></i>
      <span id="alert-text">Something went wrong.</span>
    </div>

    <!-- EMAIL -->
    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <div class="input-wrap">
        <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required/>
        <i class="fas fa-envelope icon-left"></i>
      </div>
    </div>

    <!-- PASSWORD -->
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required/>
        <i class="fas fa-lock icon-left"></i>
        <button class="toggle-pw" type="button" id="togglePw" title="Show/Hide Password">
          <i class="fas fa-eye" id="pw-eye"></i>
        </button>
      </div>
    </div>

    <!-- REMEMBER + FORGOT -->
    <div class="helper-row">
      <div class="remember-wrap" id="rememberWrap" onclick="toggleRemember()">
        <div class="custom-check" id="checkBox"></div>
        <span class="remember-label">Remember me</span>
      </div>
      <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
    </div>

    <!-- SUBMIT -->
    <button class="submit-btn" id="loginBtn" onclick="login()">
      <span class="btn-text"><i class="fas fa-arrow-right-to-bracket"></i> Sign In</span>
      <div class="btn-spinner"></div>
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">Don't have an account?</span>
      <div class="divider-line"></div>
    </div>

    <div class="register-row">
      New here? <a href="register.html">Create an account →</a>
    </div>

    <div class="id-chip">
      <i class="fas fa-shield-halved"></i>
      <span>MY INDEX</span> · Internal Portal · Secure
    </div>
  </div>

</div>

<!-- FIREBASE -->
<script type="module">// login.html හි ස්කින්දම් script tag එකට මෙම code පුරවන්න
import { auth, db } from "./firebase-config.js";
import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

function showAlert(msg, type='error') {
  const box = document.getElementById('alert-box');
  const txt = document.getElementById('alert-text');
  box.className = `alert ${type}`;
  txt.textContent = msg;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function setLoading(on) {
  const btn = document.getElementById('loginBtn');
  btn.classList.toggle('loading', on);
  btn.disabled = on;
}

window.login = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    showAlert('Email සහ password දෙන්න.');
    return;
  }

  setLoading(true);
  try {
    const result = await signInWithEmailAndPassword(auth, email, password);
    const user = result.user;

    // Firestore එ user දත්ත හදුනා ගන්න
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    if (!userSnap.exists()) {
      // පළමු ලොගිනුවෙන් පස්සේ document එක create කරන්න
      await setDoc(userRef, {
        uid: user.uid,
        displayName: user.displayName || 'User',
        email: user.email,
        approved: false,
        subscriptionActive: false,
        createdAt: new Date(),
        lastLogin: new Date()
      });
      setTimeout(() => { window.location.href = 'pending-approval.html'; }, 900);
      return;
    }

    // Approval status check කරන්න
    const userData = userSnap.data();
    if (!userData.approved) {
      showAlert('Admin එකෙන් approval බලාගනිමිනිවා. පසුව නැවත උත්සාහ කරන්න.');
      setLoading(false);
      setTimeout(() => { window.location.href = 'pending-approval.html'; }, 1500);
      return;
    }

    // ✅ තරණ කරන්න: ඩැශ්බෝඩ් නොවෙයි, student-profile.html වෙත යන්න
    showAlert('Login successful! Redirecting…', 'success');
    setTimeout(() => { window.location.href = 'student-profile.html'; }, 900);

  } catch (error) {
    const msgs = {
      'auth/user-not-found': 'Email එක පිටින්නෙ නෑ.',
      'auth/wrong-password': 'Password එක wrong පිටින්නවා.',
      'auth/invalid-email': 'Valid email දෙන්න.',
      'auth/too-many-requests': 'ඉතා බොහෝ උත්සාහයි. පසුව නැවත උත්සාහ කරන්න.',
      'auth/invalid-credential': 'Email හෝ password එක invalid පිටින්නවා.',
    };
    showAlert(msgs[error.code] || error.message);
  } finally {
    setLoading(false);
  }
};

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') window.login();
});
</script>
<script>
// Theme
const saved = localStorage.getItem('ict-theme') || 'light';
if (saved === 'dark') { document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeBtn').innerHTML='<i class="fas fa-sun"></i>'; }
document.getElementById('themeBtn').addEventListener('click', () => {
  const d = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', d ? 'light' : 'dark');
  document.getElementById('themeBtn').innerHTML = d ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
  localStorage.setItem('ict-theme', d ? 'light' : 'dark');
});

// Password toggle
document.getElementById('togglePw').addEventListener('click', () => {
  const inp = document.getElementById('password');
  const eye = document.getElementById('pw-eye');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  eye.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
});

// Remember toggle
function toggleRemember() {
  document.getElementById('rememberWrap').classList.toggle('checked');
}

// Bubbles
function createBubbles() {
  const w = document.getElementById('bubbles');
  const cols = ['#7c3aed','#9333ea','#a855f7','#c084fc','#6d28d9'];
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div'); b.className = 'bubble';
    const sz = Math.random() * 80 + 30;
    b.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-duration:${12+Math.random()*18}s;animation-delay:${Math.random()*10}s;`;
    w.appendChild(b);
  }
}
createBubbles();
</script>
</body>
</html>
